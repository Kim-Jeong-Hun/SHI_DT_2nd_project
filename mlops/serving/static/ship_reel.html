<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SHIP—26 선(船)견지명</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend+Exa:wght@200;300;400&family=Inter:wght@300;400;500&family=IBM+Plex+Sans+KR:wght@300;400;500&display=swap">
<style>
/* 한국어는 어절 단위로 줄바꿈 (CLAUDE.md 표기 규칙) */
html{word-break:keep-all;overflow-wrap:break-word;line-break:strict}

/* 제품 쇼케이스형 스크롤: 한 장면에 하나의 초점. 배경(그라디언트) → 뒤 글자 → 3D 배(투명 캔버스) → 앞 글자 순으로 겹친다 */
:root{--fg:#111;--mu:#8a8a8a;--disp:"Lexend Exa","Inter",sans-serif;--body:"Inter","IBM Plex Sans KR",system-ui,sans-serif;--kr:"IBM Plex Sans KR","Inter",sans-serif;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0}
body{background:#ececec;color:var(--fg);font-family:var(--body);overflow-x:hidden}
#bg{position:fixed;inset:0;z-index:0}
#bg i{position:absolute;width:90vmax;height:90vmax;border-radius:50%;filter:blur(60px);opacity:.55;pointer-events:none;will-change:transform}
.layer{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#back{z-index:1}#gl{position:fixed;inset:0;width:100vw;height:100vh;z-index:2;display:block}#front{z-index:3}
#spacer{position:relative;z-index:0}
.sc{position:absolute;inset:0;opacity:0;will-change:opacity}
.disp{font-family:var(--disp);font-weight:300;letter-spacing:.02em;line-height:.92;text-transform:uppercase;white-space:nowrap;margin:0}
/* 0 로더 */
#ld{position:fixed;inset:0;z-index:9;display:grid;place-items:center;background:#ececec;transition:opacity 1.2s ease}
#ld .c{width:min(82vmin,620px);aspect-ratio:1;border-radius:50%;border:1.5px solid #d2d2d2;display:grid;place-items:center;font-size:13px;color:#111}#ld .c span{color:#999}
#ring{position:absolute;left:50%;top:50%;width:min(80vmin,620px);aspect-ratio:1;border-radius:50%;border:1.5px solid rgba(0,0,0,.12);transform:translate(-50%,-50%)}
/* 1 히어로 */
#hero{display:flex;justify-content:space-between;align-items:center;padding:0 1vw}
#hero b{font-family:var(--disp);font-weight:200;font-size:22vw;line-height:1;color:#a9a9a9;transition:transform 1.6s cubic-bezier(.2,.7,.1,1);display:inline-block}
.pre #hero b.l{transform:translateX(-60vw)}.pre #hero b.r{transform:translateX(60vw)}
/* 2 큰 글자 */
#big{position:absolute;left:0;right:0;top:0}
#big p{font-size:11.2vw;color:#cfcfcf}
#big p:nth-child(1){padding-left:10vw}#big p:nth-child(2){padding-left:62vw}#big p:nth-child(3){padding-left:22vw}#big p:nth-child(4){padding-left:10vw}#big p:nth-child(5){padding-left:10vw}
/* 패널 */
.pan{position:absolute;width:min(300px,30vw);font-size:13.5px;line-height:1.25;color:var(--fg)}
.pan h4{margin:0 0 10px;font-weight:400;font-size:13px;color:var(--mu)}.pan p{margin:0 0 34px;font-family:var(--kr);font-weight:400;line-height:1.5}
.dial{position:absolute;width:130px;height:130px}
/* 4 세로 글자 */
#vert{position:absolute;left:50%;top:0;transform:translateX(-50%);text-align:center}
#vert b{display:block;font-family:var(--disp);font-weight:300;font-size:34vh;line-height:.86;color:#0d0d0d}
#vtag{position:absolute;right:16vw;bottom:5vh;transform-origin:right bottom;transform:rotate(-90deg) translateX(100%);font-size:9vh;color:var(--fg)}
/* 5 분해 라벨 */
#explore{position:absolute;left:50%;top:4.5vh;transform:translateX(-50%);font-size:13px;color:var(--mu);display:flex;gap:10px;align-items:center}
#explore i{width:26px;height:26px;border-radius:50%;border:1px solid currentColor;display:grid;place-items:center;font-style:normal;font-size:12px}
.bl{position:absolute;bottom:3vh;width:0;pointer-events:auto;cursor:pointer}
.bl .ln{position:absolute;left:0;bottom:0;width:1px;background:rgba(255,255,255,.25)}
.bl .tx{position:absolute;left:-9px;bottom:0;writing-mode:vertical-rl;text-orientation:sideways;transform:rotate(180deg);font-size:13px;color:#cfcfcf;white-space:nowrap;font-family:var(--kr);transition:color .3s}
.bl.on .tx{color:#fff}.bl .tip{position:absolute;left:14px;bottom:0;width:220px;font-size:12px;line-height:1.45;color:#ddd;font-family:var(--kr);opacity:0;transition:opacity .3s}.bl.on .tip{opacity:1}
/* 6 코어 */
#coreT{position:absolute;left:17vw;top:24vh;font-size:clamp(34px,4.4vw,72px);line-height:1}
#cnt{position:absolute;right:2vw;bottom:5vh;font-family:var(--disp);font-weight:200;font-size:17vw;line-height:.8;color:#e8e8e8;text-align:right}
#cnt small{display:block;font-family:var(--kr);font-size:13px;color:#888;font-weight:400;margin-top:8px}
/* 7 정직 */
#hon{position:absolute;left:10vw;top:-2vh}#hon p{font-size:10.6vw;color:#3a3a3a}
/* 8~9 가이드선 제목 */
.guide{position:absolute;inset:0}.guide svg{position:absolute;inset:0;width:100%;height:100%}
.ctr{position:absolute;left:50%;top:11vh;transform:translateX(-50%);text-align:center}
.ctr .disp{font-size:clamp(40px,6.2vw,96px);font-weight:300}.ctr p{font-family:var(--kr);font-size:14px;line-height:1.6;max-width:460px;margin:22px auto 0}
.plus{position:absolute;left:50%;top:9vh;transform:translate(-50%,-50%);font-size:16px}
/* 10 매크로 */
#mac{position:absolute;left:10vw;top:0}#mac p{font-size:11vw;color:#161616}
/* 11 선종 회전 */
#cname{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center}#cname p{font-size:13vw;color:rgba(255,255,255,.22)}
#cl{position:absolute;left:2.2vw;top:50%;transform:translateY(-50%);font-size:14px;color:#eee}#cr{position:absolute;right:2.2vw;top:50%;transform:translateY(-50%);font-size:14px;color:#ddd}
#cb{position:absolute;left:50%;bottom:6vh;transform:translateX(-50%);text-align:center;color:#f2f2f2;font-family:var(--kr)}
#cb .v{font-family:var(--disp);font-weight:300;font-size:clamp(30px,3.6vw,54px)}#cb .d{font-size:13px;color:rgba(255,255,255,.7);margin-top:6px}
/* 12 마무리 */
#fin{display:flex;justify-content:space-between;align-items:flex-start;padding:16vh 1.5vw 0}
#fin b{font-family:var(--disp);font-weight:300;font-size:19vw;line-height:1}
.sel{position:absolute;left:50%;top:50%;width:76px;height:76px;margin:-38px;border-radius:50%;border:1px solid #bbb;background:rgba(255,255,255,.7);box-shadow:0 0 0 4px rgba(255,255,255,.6);display:grid;place-items:center;text-align:center;font-size:10.5px;line-height:1.15;color:#111;text-decoration:none;pointer-events:auto;transition:transform .3s}
.sel:hover{transform:scale(1.12)}
#links{position:absolute;left:50%;top:calc(50% + 70px);transform:translateX(-50%);display:flex;gap:22px;font-size:12px;pointer-events:auto}#links a{color:#555;text-decoration:none;border-bottom:1px solid #bbb}
/* ===== 발표용 삽입 장면 (표지 연출은 그대로 두고 시간을 멈춘 채 재생) ===== */
.ins{position:absolute;inset:0}
.ins .ttl{position:absolute;left:6vw;top:10vh;font-size:clamp(38px,5.2vw,86px);line-height:.95}
.ins .sub{position:absolute;left:6vw;font-family:var(--kr);font-size:14px;line-height:1.6;max-width:440px}
.ins .k{font-family:var(--body);font-size:11px;letter-spacing:.24em;text-transform:uppercase;opacity:.6}
.num{font-family:var(--disp);font-weight:200;font-variant-numeric:tabular-nums}
/* 문제: 다섯 선종 월 수주 */
#pr-chart{position:absolute;left:6vw;width:58vw;top:49vh;bottom:9vh;display:grid;grid-template-rows:repeat(5,1fr) 18px;gap:6px}
.pr-row{display:grid;grid-template-columns:96px 1fr 120px;align-items:center;gap:14px;border-top:1px solid rgba(0,0,0,.08)}
.pr-row b{font-family:var(--kr);font-weight:400;font-size:12.5px;color:#333}.pr-row svg{width:100%;height:100%;overflow:visible}
.pr-row path{fill:none;stroke:#1a1a1a;stroke-width:1.15;vector-effect:non-scaling-stroke;stroke-dasharray:1;stroke-dashoffset:1}
.pr-row span{font-size:12px;color:#555;text-align:right}.pr-row span .num{font-size:22px;color:#111;display:block;line-height:1}
.pr-ax{display:flex;justify-content:space-between;padding:0 134px 0 110px;font-size:10.5px;color:#888;font-variant-numeric:tabular-nums}
#pr-stat{position:absolute;left:6vw;top:35vh;display:flex;gap:44px;color:#111}
#pr-stat div{font-size:12px;color:#666;font-family:var(--kr)}#pr-stat .num{display:block;font-size:clamp(26px,2.6vw,40px);color:#111;margin-bottom:4px}
/* 방법: 타임라인 */
#me-svg{position:absolute;left:4vw;width:92vw;top:56vh;height:auto}
#me-svg text{font-family:Inter,"IBM Plex Sans KR",sans-serif;fill:#d8d8d8}
#me-svg .g{opacity:0;transition:opacity .25s}
#me-note{position:absolute;right:6vw;top:13vh;width:min(380px,34vw);color:#ddd;font-family:var(--kr);font-size:13.5px;line-height:1.65}
#me-note b{color:#fff;font-weight:500}
/* 결과 표 */
#rs{position:absolute;left:6vw;top:36vh;width:min(780px,62vw);color:#eee}
.rs-h,.rs-r{display:grid;grid-template-columns:120px repeat(3,1fr) 1.7fr;align-items:end;gap:10px}
.rs-h{font-size:11px;color:#888;letter-spacing:.06em;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.18)}
.rs-r{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.08);opacity:0}
.rs-r b{font-family:var(--kr);font-weight:400;font-size:13.5px}.rs-r .num{font-size:clamp(22px,2.3vw,34px);color:#fff}
.rs-r .num small{font-size:12px;color:#888;margin-left:2px;font-family:var(--body)}
.db{position:relative;height:30px}.db i{position:absolute;top:13px;height:1px;background:rgba(255,255,255,.35)}
.db s,.db u{position:absolute;top:8px;width:11px;height:11px;margin-left:-5.5px;border-radius:50%;text-decoration:none}
.db s{background:#fff}.db u{border:1.5px solid #9a9a9a;box-sizing:border-box}
.db em{position:absolute;top:-6px;font-style:normal;font-size:10.5px;color:#aaa;white-space:nowrap;transform:translateX(-50%)}
#rs-foot{margin-top:18px;font-family:var(--kr);font-size:13.5px;color:#ccc}#rs-foot b{color:#fff;font-weight:500}
/* 파이프라인 */
#sy{position:absolute;left:6vw;right:6vw;top:44vh;display:flex;align-items:flex-start}
.sy-n{flex:0 0 auto;width:15vw;min-width:150px;opacity:0}.sy-n .k{color:#777}
.sy-n h5{margin:8px 0 6px;font-family:var(--disp);font-weight:300;font-size:clamp(16px,1.5vw,22px);color:#111;letter-spacing:.02em}
.sy-n p{margin:0;font-family:var(--kr);font-size:12.5px;color:#555;line-height:1.55}
.sy-l{flex:1 1 auto;position:relative;height:1px;background:rgba(0,0,0,.22);margin:34px 10px 0}.sy-l i{position:absolute;top:-2.5px;width:6px;height:6px;border-radius:50%;background:#111}
/* 배운 점 */
#nx{position:absolute;left:6vw;right:6vw;top:42vh;display:grid;grid-template-columns:repeat(3,1fr);gap:4vw}
#nx div{opacity:0;border-top:1px solid rgba(0,0,0,.25);padding-top:16px}
#nx .num{font-size:clamp(34px,3.4vw,54px);color:#111;display:block;margin-bottom:10px}
#nx h5{margin:0 0 10px;font-family:var(--kr);font-weight:500;font-size:16px;color:#111}#nx p{margin:0;font-family:var(--kr);font-size:13px;line-height:1.65;color:#444}
/* ===== v3: 문장 하나 · 큰 숫자 하나 · 그림 하나 ===== */
.ins .lede{position:absolute;left:6vw;top:calc(10vh + clamp(38px,5.2vw,86px)*2.2 + 26px);font-family:var(--kr);font-size:15px}
.ins .lede b{font-weight:600}
.ins .hero{position:absolute;right:6vw;top:12vh;text-align:right;max-width:44vw}
.ins .hero .num{display:block;font-size:clamp(64px,9vw,150px);line-height:.9;letter-spacing:-.01em}.ins .hero .num small{font-size:.38em;margin-left:2px}
.ins .hero em{display:block;font-style:normal;font-family:var(--kr);font-size:13.5px;opacity:.75;margin-top:10px}
.ins .msg{position:absolute;left:6vw;right:6vw;bottom:7vh;font-family:var(--kr);font-size:clamp(14px,1.25vw,18px);line-height:1.6;max-width:980px}.ins .msg b{font-weight:600}
/* 01 결론 */
#fc .msg{position:static;margin-top:26px}
#fc{position:absolute;left:6vw;right:6vw;top:42vh;display:grid;gap:4px}
.fc-r{display:grid;grid-template-columns:110px 190px 1fr 250px;align-items:center;gap:18px;padding:9px 0;border-top:1px solid rgba(0,0,0,.08);opacity:0}
.fc-r b{font-family:var(--kr);font-weight:500;font-size:14px;color:#111}.fc-r .num{font-size:clamp(24px,2.4vw,38px);color:#111}.fc-r .num small{font-size:12px;color:#777;margin-left:6px;font-family:var(--body)}
.fc-t{position:relative;height:22px}.fc-t::before{content:"";position:absolute;left:0;right:0;top:10.5px;height:1px;background:rgba(0,0,0,.12)}
.fc-band{position:absolute;top:5px;height:12px;background:rgba(0,0,0,.14);border-radius:2px}
.fc-pt{position:absolute;top:0;width:3px;height:22px;margin-left:-1.5px;background:#111}
.fc-base{position:absolute;top:2px;width:0;height:18px;margin-left:-.5px;border-left:1.5px dashed #888}
.fc-d{font-size:12px;color:#666;font-variant-numeric:tabular-nums}
.fc-lg{display:flex;gap:22px;flex-wrap:wrap;font-size:11.5px;color:#666;padding-top:12px;font-family:var(--kr)}
.fc-lg span{display:inline-flex;align-items:center;gap:7px}.fc-lg i{position:static;display:inline-block;margin:0}.fc-lg .fc-band{width:22px;height:9px}.fc-lg .fc-pt{height:13px}.fc-lg .fc-base{height:13px}
/* 02 왜 어려운가 */
#wh{position:absolute;left:6vw;right:6vw;top:43vh;bottom:22vh}
#wh svg{width:100%;height:100%;overflow:visible}#wh path{fill:none;stroke:#111;stroke-width:1.4;vector-effect:non-scaling-stroke;stroke-dasharray:1;stroke-dashoffset:1}
#wh .wh-med{stroke:#999;stroke-dasharray:4 4;vector-effect:non-scaling-stroke}
.wh-pk{position:absolute;top:-22px;transform:translateX(-50%);font-size:12px;color:#111;white-space:nowrap;font-variant-numeric:tabular-nums}
.wh-ml{position:absolute;right:0;bottom:-20px;font-size:11.5px;color:#777;font-family:var(--kr)}
.wh-ax{position:absolute;left:0;right:0;bottom:-20px;height:14px}.wh-ax span{position:absolute;transform:translateX(-50%);font-size:10.5px;color:#888}
/* 04 분기로 보면 */
#mq{position:absolute;left:6vw;width:min(760px,58vw);top:44vh}
.mq-r{display:grid;grid-template-columns:110px 1fr 120px;align-items:center;gap:16px;padding:10px 0;border-top:1px solid rgba(255,255,255,.1)}
.mq-r b{font-family:var(--kr);font-weight:400;font-size:13.5px;color:#eee}.mq-r>span{text-align:right;font-size:12px;color:#999}.mq-r .num{font-size:22px;color:#fff;margin-right:2px}
.mq-t{position:relative;height:16px}.mq-m,.mq-q{position:absolute;left:0;height:5px;border-radius:3px;width:0}
.mq-m{top:1px;background:rgba(255,255,255,.28)}.mq-q{top:10px;background:#fff}
.fc-lg .mq-m,.fc-lg .mq-q{width:22px;height:5px}
/* 05 현실 점검 */
#rc{position:absolute;left:6vw;right:6vw;top:44vh;display:grid;grid-template-columns:repeat(5,1fr);gap:2.4vw}
.rc-c{opacity:0}.rc-c svg{width:100%;height:16vh;overflow:visible;border-bottom:1px solid rgba(255,255,255,.18)}
.rc-c path{fill:none;vector-effect:non-scaling-stroke}.rc-a{stroke:#fff;stroke-width:1.8}.rc-p{stroke:#fff;stroke-width:1.2;stroke-dasharray:4 3;opacity:.75}.rc-b{stroke:#777;stroke-width:1.2}
.rc-c b{display:block;margin-top:12px;font-family:var(--kr);font-weight:500;font-size:14px;color:#fff}.rc-c span{display:block;font-size:12px;color:#999;margin-top:4px}.rc-c .rc-w{color:#fff}
#rc-lg{position:absolute;left:6vw;top:calc(44vh + 16vh + 96px)}
#rc-lg i{width:22px;height:0;border-top:1.8px solid #fff}#rc-lg .rc-lp{border-top:1.2px dashed #fff}#rc-lg .rc-lb{border-top:1.2px solid #777}
/* 07 다음 단계 (6pt 숫자 대신 단어) */
#nx .num{font-family:var(--kr);font-weight:500}#nx p{font-size:14.5px;line-height:1.7}
/* 선종 회전: 최근 36개월 + 예측 범위 */
#spark{display:block;width:min(420px,80vw);height:56px;margin:0 auto 10px;overflow:visible}
#spark path{fill:none;stroke:rgba(255,255,255,.85);stroke-width:1.2;vector-effect:non-scaling-stroke}
/* ===== v4 구도 (body.la, 가로 화면) — 정보 장면은 오른쪽 열에 플랜뷰 배를 고정하고 왼쪽에 내용 ===== */
@media (min-aspect-ratio:11/10){
body.la #fc,body.la #wh,body.la #rc,body.la #nx{right:38vw}
body.la .ins .msg{right:38vw;max-width:none}
body.la #rc{gap:1.4vw}
body.la #nx{gap:2.6vw}
body.la #sy{right:38vw}body.la .sy-n{width:9.4vw;min-width:0}body.la .sy-n h5{font-size:clamp(14px,1.12vw,18px)}body.la .sy-n p{font-size:11.5px}body.la .sy-l{margin:34px 6px 0}
}
/* ===== v4 도면 스타일 (body.bp) — 종이 · 잉크 · 모눈, 움직임 최소 ===== */
body.bp{--ink:#1f2b33;--paper:#f3f1ea;background:var(--paper)}
body.bp #bg{background-color:var(--paper);background-image:linear-gradient(rgba(31,43,51,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(31,43,51,.055) 1px,transparent 1px),linear-gradient(rgba(31,43,51,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(31,43,51,.09) 1px,transparent 1px);background-size:32px 32px,32px 32px,160px 160px,160px 160px}
body.bp #bg i{display:none}body.bp #ld{background:var(--paper)}
body.bp #s_core *,body.bp #s_i_meth *,body.bp #s_i_mq *,body.bp #s_i_real *,body.bp #s_carF *,body.bp .bl .tx{color:var(--ink)!important}
body.bp #s_core .pan h4,body.bp #s_i_meth .k,body.bp #s_i_mq .k,body.bp #s_i_real .k,body.bp #s_i_mq .hero em,body.bp #s_i_real .hero em,body.bp .rc-c span,body.bp .mq-r>span,body.bp #s_carF .d,body.bp #s_i_mq .fc-lg,body.bp #s_i_real .fc-lg,body.bp #cnt small{color:#6b7378!important}
body.bp .rc-c .rc-w{color:var(--ink)!important;font-weight:600}
body.bp #coreT span:first-child{color:#8a9196!important}body.bp #cnt{color:rgba(31,43,51,.85)}
body.bp #cname p{color:rgba(31,43,51,.09)}body.bp .bl .ln{background:rgba(31,43,51,.35)}
body.bp #me-svg text{fill:var(--ink)}body.bp #me-svg text[fill="#888"],body.bp #me-svg text[fill="#aaa"]{fill:#6b7378}
body.bp #me-svg line,body.bp #me-svg path{stroke:var(--ink)}body.bp #me-svg rect{stroke:var(--ink);fill:rgba(31,43,51,.05)}body.bp #me-svg rect.solid{fill:var(--ink)}body.bp #me-svg circle{fill:var(--ink)}
body.bp .mq-m{background:rgba(31,43,51,.2)}body.bp .mq-q{background:var(--ink)}body.bp .mq-r{border-top-color:rgba(31,43,51,.12)}
body.bp .rc-a,body.bp .rc-p{stroke:var(--ink)}body.bp .rc-b{stroke:#9aa2a6}body.bp .rc-c svg{border-bottom-color:rgba(31,43,51,.2)}
body.bp #rc-lg i{border-top-color:var(--ink)}body.bp #rc-lg .rc-lb{border-top-color:#9aa2a6}
body.bp #spark path{stroke:var(--ink)}
/* 상단 표시 */

/* ---- 공용 형상 도우미 ---- */
const RB=(w,h,d,r=.3)=>{const rr=Math.max(.02,Math.min(r,w/2-.02,h/2-.02,d/2-.02));return new THREE.RoundedBoxGeometry(w,h,d,2,rr);};

/* ---- 거주구: 층별 블록(모서리 둥근) + 층 사이 통로 갑판·난간 + 입체 창 + 기울어진 브리지 유리 + 윙 캐빈 + 지붕 장비 + 연돌 + 구명정 ---- */
function house(grp,M,{x,w,d,decks,y0,B,funnel,fcol,ib}){const H=2.8,front=x+d/2,gW=[],gS=[],gG=[],gR=[],gD=[],gO=[],gWh=[];
  for(let k=0;k<decks;k++){const dk=d-k*(ib?.3:.6),cx=front-dk/2,yk=y0+k*H,wk=w*(1-(ib?0:k*.01));

    const yr=yk+H-.06,hx=dk/2+.6,hz=wk/2+.6;rail(gR,[V3(cx-hx,yr,-hz),V3(cx+hx,yr,-hz),V3(cx+hx,yr,hz),V3(cx-hx,yr,hz)]);

    const nf=Math.max(2,Math.floor((wk-2.4)/3.1));for(let i=0;i<nf;i++){const z=-wk/2+1.2+(i+.5)*(wk-2.4)/nf;gG.push(box(.14,1.05,1.25,front+.04,yk+.95,z));}

      const gc=new THREE.BoxGeometry(.16,1.3,2.2);gc.rotateZ(-.21);gc.translate(front+.08,yb+1.55,sd*(wl-1.3));gG.push(gc);

  // 지붕 장비: 테이퍼 마스트·야드암·항해등, 레이더 2기(회전), 위성 레이돔, 휩 안테나

function gear(grp,M,Hh,sp,yD,XN){const {L,B,D,T}=sp,gG=[],gD=[],gY=[],yF=yD+2.4;
