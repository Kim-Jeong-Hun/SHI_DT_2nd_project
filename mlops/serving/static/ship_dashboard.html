<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>선(船)견지명 수주 관제</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 한국어는 어절 단위로 줄바꿈 (CLAUDE.md 표기 규칙) */
html{word-break:keep-all;overflow-wrap:break-word;line-break:strict}

/* 레이아웃: 상단 요약 띠(선종 5칩) → 왼쪽 선종×지표 버블 매트릭스, 오른쪽 선택 선종 상세(이력·2026 예측) → 아래 변수 계층(선버스트·트리맵) */
:root{
  --bg:#F5F7FB; --panel:#FFFFFF; --ink:#111214; --sub:#4C525A; --faint:#8A90A0; --line:#DDE0E5;
  --accent:#024AD8; --accent2:#296EF9; --tint:#EAF0FD;
  --good:#1D7F4E; --warn:#B45F06; --bad:#B3261E;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1117; --panel:#151B24; --ink:#E8ECF2; --sub:#A6AEBB; --faint:#6E7684; --line:#273040;
  --accent:#6E9BFF; --accent2:#8FB3FF; --tint:#18243D; --good:#4CC38A; --warn:#E8A15C; --bad:#F07067; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1117; --panel:#151B24; --ink:#E8ECF2; --sub:#A6AEBB; --faint:#6E7684; --line:#273040;
  --accent:#6E9BFF; --accent2:#8FB3FF; --tint:#18243D; --good:#4CC38A; --warn:#E8A15C; --bad:#F07067; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;padding-inline:16px;padding-block:22px 40px;margin:0}
.wrap{max-width:1240px;margin:0 auto;display:grid;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px;border-bottom:2px solid var(--accent);padding-bottom:12px}
header h1{margin:0;font-size:clamp(20px,3vw,26px);font-weight:700;text-wrap:balance}
header h1 span{color:var(--accent)}
.meta{color:var(--sub);font-size:12.5px}
.strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer;display:grid;gap:4px;text-align:left;color:inherit;font:inherit}
.chip:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.chip .nm{font-weight:700;font-size:14px}
.chip .v{font-family:var(--f-num);font-size:20px;font-variant-numeric:tabular-nums}
.chip .s{font-size:12px;color:var(--sub)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;border:1px solid currentColor;width:max-content}
.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.grid2{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:18px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.panel h2{margin:0 0 2px;font-size:15px;font-weight:700}
.panel p.d{margin:0 0 8px;color:var(--sub);font-size:12.5px}
.chart{width:100%;height:340px}
.chart.tall{height:420px}
.tabs{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:transparent;color:var(--sub);border-radius:999px;padding:3px 12px;font:inherit;font-size:12.5px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.note{font-size:12px;color:var(--faint)}
.kv{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--sub);margin-bottom:6px}
.kv b{color:var(--ink);font-family:var(--f-num);font-weight:600}
.kv b.m{font-family:var(--f-body);font-weight:700}
@media (max-width:860px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:minmax(0,1fr)}.chart{height:300px}.chart.tall{height:360px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><style>
.fc{display:grid;gap:10px;align-content:start}
.fcTitle{font-weight:700;font-size:15px}
.fcBig{font-family:var(--f-num);font-size:clamp(28px,4vw,40px);font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.fcBig .unit{font-size:16px;color:var(--sub)}
.range{display:grid;gap:4px}
.rbar{position:relative;height:16px;background:var(--tint);border-radius:8px}
.rfill{position:absolute;top:0;bottom:0;background:var(--accent2);opacity:.35;border-radius:8px}
.rpt{position:absolute;top:-4px;width:4px;height:24px;background:var(--accent);border-radius:2px;transform:translateX(-2px)}
.rbase{position:absolute;top:-4px;width:2px;height:24px;background:var(--warn);transform:translateX(-1px)}
.rlab{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--sub);flex-wrap:wrap}
</style><div class="wrap">
  <header>
    <div><div class="meta">3조 선(船)견지명 · 미니프로젝트2 · <span id="apiState">API 연결 중…</span></div><h1><span>선(船)견지명</span> 선박 수주 예측 관제</h1></div>
    <div class="meta" id="hdrMeta">예측기준일 2026-09-30 · 게시일 확인된 수주만 입력</div>
  </header>
  <section class="strip" id="strip" aria-label="선종 선택"></section>
  <div class="grid2">
    <section class="panel fc">
      <div class="tabs" role="tablist" id="hTabs">
        <button class="tab" role="tab" aria-selected="false" data-h="1" id="h1">+1개월</button>
        <button class="tab" role="tab" aria-selected="true" data-h="3" id="h3">+3개월</button>
        <button class="tab" role="tab" aria-selected="false" data-h="6" id="h6">+6개월</button>
      </div>
      <div class="fcTitle" id="fcTitle">–</div>
      <div class="fcBig"><span id="fcVal">–</span><span class="unit" id="fcUnit"></span></div>
      <div class="range"><div class="rbar"><div class="rfill" id="rFill"></div><div class="rpt" id="rPt"></div><div class="rbase" id="rBase"></div></div>
        <div class="rlab"><span id="rLo"></span><span id="rHi"></span></div></div>
      <div class="kv" id="fcKv"></div>
      <p class="d" id="fcWhy"></p>
    </section>
    <section class="panel">
      <h2 id="cTitle">수주 이력 · 2026 백테스트 · 예측</h2>
      <p class="d">검은 선 실제, 파란 점 같은 설정의 2026 백테스트 예측, 오른쪽 끝 막대가 이번 예측과 범위입니다.</p>
      <div id="chart" class="chart"></div>
    </section>
  </div>
  <section class="panel">
    <h2>선종 × 오차 매트릭스</h2>
    <p class="d">원이 작고 초록일수록 오차가 작습니다(sMAPE %). 선종을 누르면 위가 바뀝니다.</p>
    <div id="matrix" class="chart" style="height:320px"></div>
    <p class="note" id="foot"></p>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
<script>
const CSS = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const API = (location.protocol.startsWith('http') && !location.hostname.endsWith('claude.ai')) ? '' : 'http://127.0.0.1:8000';
const fmt = v => v == null ? '–' : v >= 1e6 ? (v / 1e6).toFixed(2) + 'M' : v >= 1e3 ? Math.round(v / 1e3) + 'k' : String(Math.round(v));
const full = v => v == null ? '–' : Math.round(v).toLocaleString('ko-KR');
let META = null, ship = '컨테이너선', horizon = 3, FC = null;
const charts = {};
const chart = id => charts[id] || (charts[id] = echarts.init(document.getElementById(id)));
const ax = () => ({ axisLine: { lineStyle: { color: CSS('--line') } }, axisLabel: { color: CSS('--sub'), fontSize: 11 }, splitLine: { lineStyle: { color: CSS('--line'), opacity: .6 } } });
const stateOf = s => s['2026월별sMAPE'] < s['2026기준선sMAPE'] - 0.005 ? ['good', '기준선보다 나음'] : Math.abs(s['2026월별sMAPE'] - s['2026기준선sMAPE']) <= 0.005 ? ['warn', '기준선과 같음'] : ['bad', '기준선 미달'];

async function get(path) { const r = await fetch(API + path); if (!r.ok) throw new Error((await r.json()).detail || r.status); return r.json(); }

function strip() {
  const el = document.getElementById('strip'); el.innerHTML = '';
  META['선종'].forEach(s => {
    const [c, t] = stateOf(s), b = document.createElement('button');
    b.className = 'chip'; b.setAttribute('aria-pressed', s['선종'] === ship);
    b.innerHTML = `<span class="nm"></span><span class="v">${s['테스트sMAPE_반기'].toFixed(1)}%</span><span class="s">반기 누적 오차 · ${s['단위']}</span><span class="pill ${c}">${t}</span>`;
    b.querySelector('.nm').textContent = s['선종'];
    b.onclick = () => { ship = s['선종']; load(); };
    el.appendChild(b);
  });
}

function card() {
  const f = FC, r = f['예측범위'], base = f['기준선_최근3개월평균'];
  document.getElementById('fcTitle').textContent = `${f['선종']} · ${f['목표월']} 신규 수주 예측 (+${f['선행개월']}개월)`;
  document.getElementById('fcVal').textContent = full(f['예측']);
  document.getElementById('fcUnit').textContent = ' ' + f['단위'];
  const lo = r ? r['하한'] : f['예측'], hi = r ? r['상한'] : f['예측'];
  const mx = Math.max(hi, f['예측'] || 0, base || 0) * 1.05, pct = v => (100 * v / mx).toFixed(1) + '%';
  const fill = document.getElementById('rFill'); fill.style.left = pct(lo); fill.style.width = `calc(${pct(hi)} - ${pct(lo)})`;
  document.getElementById('rPt').style.left = pct(f['예측'] || 0);
  const rb = document.getElementById('rBase'); rb.hidden = base == null; if (base != null) rb.style.left = pct(base);
  document.getElementById('rLo').textContent = r ? `범위 ${fmt(lo)} – ${fmt(hi)}` : '범위: 백테스트 표본 부족';
  document.getElementById('rHi').textContent = base != null ? `▲ 기준선(최근 3개월 평균) ${fmt(base)}` : '';
  const g = f['근거'], c = r ? (r['편향'] === '치우침 작음' ? 'good' : 'warn') : 'warn';
  document.getElementById('fcKv').innerHTML = `<span>모델 <b class="m"></b></span><span>입력 수주 <b>${g['입력수주관측월']}</b> (게시 ${g['입력수주게시일'] || '–'})</span><span>학습 <b>${g['학습관측월']}</b>개월</span><span>2026 백테스트 sMAPE <b>${f['백테스트']['월별sMAPE']}</b></span>${r ? `<span class="pill ${c}">${r['편향']} · 실제÷예측 ${r['실제÷예측_중앙값']}배</span>` : ''}`;
  document.querySelector('#fcKv b.m').textContent = `${g['모형']} · ${g['피처']}`;
  document.getElementById('fcWhy').textContent = (r ? r['근거'] + '. ' : '') + '외부 지표는 공표일을 복원할 수 없어 운영 예측에는 게시일이 확인된 수주 이력만 씁니다.';
}

function draw() {
  const f = FC, H = f['이력'].slice(-48), bt = Object.fromEntries(f['백테스트']['월별'].map(b => [b['목표월'], b['예측']]));
  const months = H.map(h => h[0]);
  let m = months[months.length - 1];
  while (m < f['목표월']) { const [y, mo] = m.split('-').map(Number); const d = new Date(y, mo, 1); m = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; months.push(m); }
  const act = months.map(x => { const h = H.find(k => k[0] === x); return h ? h[1] : null; });
  const r = f['예측범위'], ti = months.indexOf(f['목표월']);
  chart('chart').setOption({
    animationDuration: 400, grid: { left: 58, right: 18, top: 30, bottom: 34 },
    legend: { top: 0, textStyle: { color: CSS('--sub'), fontSize: 12 }, data: ['실제', '2026 백테스트 예측', '이번 예측'] },
    tooltip: { trigger: 'axis', valueFormatter: v => v == null ? '–' : full(v) + ' ' + f['단위'] },
    xAxis: { type: 'category', data: months, ...ax(), splitLine: { show: false }, axisLabel: { color: CSS('--sub'), fontSize: 11, interval: 5 } },
    yAxis: { type: 'value', ...ax(), axisLabel: { color: CSS('--sub'), fontSize: 11, formatter: fmt } },
    series: [
      { name: '실제', type: 'line', data: act, showSymbol: false, connectNulls: false, lineStyle: { color: CSS('--ink'), width: 1.6 }, itemStyle: { color: CSS('--ink') }, areaStyle: { color: CSS('--ink'), opacity: .05 } },
      { name: '2026 백테스트 예측', type: 'scatter', data: months.map(x => bt[x] ?? null), symbolSize: 8, itemStyle: { color: CSS('--accent2') } },
      { name: '이번 예측', type: 'scatter', data: months.map((x, i) => i === ti ? f['예측'] : null), symbolSize: 14, symbol: 'diamond', itemStyle: { color: CSS('--accent') },
        markLine: r ? { silent: true, symbol: 'none', lineStyle: { color: CSS('--accent'), width: 6, opacity: .25 }, data: [[{ coord: [ti, r['하한']] }, { coord: [ti, r['상한']] }]] } : undefined }]
  }, true);
}

function matrix() {
  const S = META['선종'], cols = ['월별', '분기 누적', '반기 누적', '2026 모델', '2026 기준선'];
  const pts = []; S.forEach((s, y) => [s['테스트sMAPE_월별'], s['테스트sMAPE_분기'], s['테스트sMAPE_반기'], s['2026월별sMAPE'] * 100, s['2026기준선sMAPE'] * 100]
    .forEach((v, x) => pts.push({ value: [x, y, +v.toFixed(1)], itemStyle: { borderColor: s['선종'] === ship ? CSS('--ink') : 'rgba(0,0,0,0)', borderWidth: 2 } })));
  const c = chart('matrix');
  c.setOption({ animationDuration: 300, grid: { left: 92, right: 16, top: 8, bottom: 30 },
    tooltip: { formatter: p => `${S[p.value[1]]['선종']} · ${cols[p.value[0]]}<br><b>${p.value[2]}%</b>` },
    xAxis: { type: 'category', data: cols, ...ax(), splitLine: { show: false } },
    yAxis: { type: 'category', data: S.map(s => s['선종']), inverse: true, ...ax(), axisLabel: { color: CSS('--ink'), fontSize: 12, fontWeight: 600 } },
    series: [{ type: 'scatter', data: pts, symbolSize: v => 10 + Math.min(v[2], 110) * .3,
      itemStyle: { color: p => { const v = p.value[2]; return v <= 15 ? CSS('--good') : v <= 50 ? CSS('--accent2') : v <= 80 ? CSS('--warn') : CSS('--bad'); }, opacity: .85 },
      label: { show: true, position: 'right', formatter: p => p.value[2].toFixed(0), color: CSS('--ink'), fontSize: 10 } }] }, true);
  c.off('click'); c.on('click', p => { ship = S[p.value[1]]['선종']; load(); });
  document.getElementById('foot').textContent = `평가기간 ${META['평가기간']} · ${META['제약']}`;
}

async function load() {
  try {
    if (!META) META = await get('/ship/meta');
    FC = await get(`/ship/forecast?ship=${encodeURIComponent(ship)}&horizon=${horizon}`);
    document.getElementById('apiState').textContent = 'API 연결됨 · 보고서 ' + META['보고서수정시각'].slice(0, 16).replace('T', ' ');
    strip(); card(); draw(); matrix();
  } catch (e) {
    document.getElementById('apiState').textContent = 'API에 연결할 수 없습니다 — uvicorn serving.app:app 실행 후 새로고침 (' + e.message + ')';
  }
}
document.querySelectorAll('#hTabs .tab').forEach(t => t.onclick = () => { horizon = +t.dataset.h; document.querySelectorAll('#hTabs .tab').forEach(x => x.setAttribute('aria-selected', x === t)); load(); });
addEventListener('resize', () => Object.values(charts).forEach(c => c.resize()));
load();

</script>
</html>
