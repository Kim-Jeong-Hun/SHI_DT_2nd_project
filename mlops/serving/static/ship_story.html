<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>선(船)견지명 · 데이터 이야기</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend+Exa:wght@200;300;400&family=Inter:wght@300;400;500;600&family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* 한국어는 어절 단위로 줄바꿈 (CLAUDE.md 표기 규칙) */
html{word-break:keep-all;overflow-wrap:break-word;line-break:strict}

/* 발표 릴(ship_reel.html)의 시각 언어를 그대로 쓴다: 연회색 바탕 · Lexend Exa 대형 글자 · 먹색 본문.
   구조는 '스티키 무대 + 스크롤 단계'. 단계가 바뀔 때마다 무대 위 차트가 다음 상태로 전환된다. */
:root{
  --bg:#ececec;--paper:#f6f6f4;--ink:#111214;--mu:#6b6f76;--dim:#a3a7ad;--ln:#d6d8dc;
  --blue:#024AD8;--blue2:#296EF9;--amber:#D98A1E;--red:#C8323C;--green:#1F8A5B;
  --c1:#296EF9;--c2:#9AA3AE;--c3:#D98A1E;
  --disp:"Lexend Exa","Inter",sans-serif;--body:"IBM Plex Sans KR","Inter",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);overflow-x:hidden}
::selection{background:#cdd9f7}

/* 상단 고정: 브랜드 · 진행 막대 · 현재 장 */
#top{position:fixed;left:0;right:0;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:14px 22px;pointer-events:none}
#brand{font-size:13px;letter-spacing:.02em}#brand span{color:var(--mu);margin-left:8px}
#chapLabel{margin-left:auto;font-family:var(--disp);font-size:11px;letter-spacing:.18em;color:var(--mu);text-transform:uppercase}
#prog{position:fixed;left:0;top:0;height:2px;background:var(--blue);z-index:21;width:0;transition:width .25s}
#dots{position:fixed;right:14px;top:50%;transform:translateY(-50%);z-index:20;display:flex;flex-direction:column;gap:7px}
#dots button{all:unset;cursor:pointer;width:7px;height:7px;border-radius:50%;background:#c4c7cc;transition:transform .2s,background .2s}
#dots button.on{background:var(--ink);transform:scale(1.5)}
#dots button:focus-visible{outline:1px solid var(--blue);outline-offset:3px}
#hint{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:20;font-size:11px;letter-spacing:.14em;color:var(--mu);font-family:var(--disp);pointer-events:none;transition:opacity .4s}

/* 장(chapter): 스티키 무대 + 단계 */
.chap{position:relative}
.stage{position:sticky;top:0;height:100vh;overflow:hidden}
.steps{position:relative;margin-top:-100vh;pointer-events:none}
.step{height:100vh;display:flex;align-items:center;padding:0 5vw}
.step.r{justify-content:flex-end}.step.c{justify-content:center}.step.b{align-items:flex-end;padding-bottom:7vh;justify-content:center}
.step.tr{align-items:flex-start;justify-content:flex-end;padding-top:8.5vh}.step.tr .card{max-width:min(470px,40vw);padding:14px 18px;font-size:14.5px}
.card{pointer-events:auto;max-width:400px;background:rgba(246,246,244,.92);backdrop-filter:blur(6px);border:1px solid var(--ln);padding:18px 20px;font-size:15px;line-height:1.65;box-shadow:0 10px 30px rgba(0,0,0,.05)}
.card b{font-weight:600}.card .k{display:block;font-family:var(--disp);font-size:10.5px;letter-spacing:.18em;color:var(--mu);margin-bottom:6px;text-transform:uppercase}
.card.ghost{opacity:0}

/* 공통 타이포 */
.disp{font-family:var(--disp);font-weight:300;letter-spacing:.01em;line-height:.95;margin:0;text-transform:uppercase}
.eyebrow{font-family:var(--disp);font-size:11px;letter-spacing:.2em;color:var(--mu);text-transform:uppercase}
.h1{font-size:clamp(30px,4.2vw,64px);font-weight:500;line-height:1.15;margin:0;letter-spacing:-.01em}
.h2{font-size:clamp(22px,2.4vw,36px);font-weight:500;line-height:1.3;margin:0}
.lead{font-size:clamp(15px,1.2vw,18px);line-height:1.7;color:#30343a;max-width:620px}
.src{position:absolute;left:22px;bottom:16px;font-size:11px;color:var(--mu);max-width:60vw}
svg text{font-family:var(--body)}
.axis text{font-size:11px;fill:var(--mu)}.axis path,.axis line{stroke:#c9ccd1}
.fade{transition:opacity .7s ease,transform .7s ease}

/* 0 표지 */
#title-stage{display:grid;place-items:center;text-align:center}
#title-stage .disp{font-size:min(13vw,190px);color:#bcbec2}
#title-stage .h1{margin-top:26px}
#title-stage .lead{margin:16px auto 0}

/* 1 자산 훑기 */
.marq{position:absolute;left:0;right:0;white-space:nowrap;font-size:clamp(18px,2.2vw,34px);color:#b7bac0;will-change:transform}
.marq span{margin-right:42px}.marq span.hl{color:var(--ink)}
.kpis{position:absolute;left:6vw;right:6vw;top:50%;transform:translateY(-50%);display:grid;grid-template-columns:repeat(4,1fr);gap:2vw}
.kpi b{display:block;font-family:var(--disp);font-weight:200;font-size:clamp(44px,7vw,120px);line-height:1}
.kpi span{display:block;margin-top:10px;font-size:14px;color:var(--mu)}

/* 2 캐릭터 선택 */
.roster{position:absolute;left:4vw;right:4vw;top:52%;transform:translateY(-50%);display:grid;grid-template-columns:repeat(5,1fr);gap:1.2vw}
.ship{all:unset;cursor:pointer;position:relative;background:var(--paper);border:1px solid var(--ln);padding:18px 16px 16px;min-height:42vh;display:flex;flex-direction:column;transition:transform .35s cubic-bezier(.2,.7,.1,1),box-shadow .35s,border-color .35s,opacity .35s}
.ship:hover{transform:translateY(-6px)}
.ship.on{border-color:var(--ink);box-shadow:0 22px 40px rgba(0,0,0,.12);transform:translateY(-12px)}
.roster.picking .ship:not(.on){opacity:.45}
.ship:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.ship .no{font-family:var(--disp);font-size:11px;color:var(--mu);letter-spacing:.16em}
.ship .nm{font-size:clamp(17px,1.5vw,22px);font-weight:600;margin-top:6px}
.ship .un{font-family:var(--mono);font-size:12px;color:var(--mu)}
.ship svg.sil{width:100%;height:auto;margin:auto 0 12px}
.ship dl{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:0;font-size:12.5px}
.ship dt{color:var(--mu)}.ship dd{margin:0;text-align:right;font-family:var(--mono)}
.ship .bar{height:4px;background:#dfe1e4;margin-top:10px;overflow:hidden}.ship .bar i{display:block;height:100%;background:var(--ink)}
.pick-title{position:absolute;left:4vw;top:12vh}

/* 차트 무대 공통 */
.chart{position:absolute;inset:9vh 4vw 8vh 4vw}
.chart svg{width:100%;height:100%;overflow:visible}
.title-tl{position:absolute;left:4vw;top:8vh;max-width:56vw}
.title-tl .h2{margin-top:6px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:#30343a;margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;margin-right:6px;vertical-align:-1px}

/* 3·4 산맥 */
.ridge-lab{font-size:11.5px;fill:#5d6168}
.ridge-lab.hl{fill:var(--ink);font-weight:600}
.gridnum{font-family:var(--mono);font-size:9.5px;fill:#7d828a}

/* 4 대안 전환 */
.alt-switch{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:5;display:flex;border:1px solid var(--ln);background:var(--paper)}
.alt-switch button{all:unset;cursor:pointer;padding:7px 14px;font-size:12.5px;color:var(--mu)}
.alt-switch button[aria-pressed=true]{background:var(--ink);color:#fff}
.alt-switch button:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.alt1-text{position:absolute;right:4vw;top:12vh;bottom:8vh;width:min(420px,34vw);display:flex;flex-direction:column;justify-content:center;gap:14px}
.acard{background:var(--paper);border:1px solid var(--ln);padding:14px 16px;font-size:14.5px;line-height:1.65;opacity:.32;transition:opacity .5s,border-color .5s,transform .5s}
.acard.on{opacity:1;border-color:var(--ink);transform:translateX(-6px)}
.acard .sp{display:block;width:100%;height:34px;margin-top:8px;overflow:hidden}
.acard .k{font-family:var(--disp);font-size:10px;letter-spacing:.18em;color:var(--mu)}

/* 6~7 군집 */
.split{position:absolute;inset:27vh 4vw 9vh 4vw;display:grid;grid-template-columns:1.25fr 1fr;gap:3vw}
.split>div{position:relative}
.split svg{width:100%;height:100%;overflow:visible}

/* 9·14 피라미드 도판 */
.fig{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);width:min(92vw,150vh);transition:opacity .8s ease,transform 1.2s cubic-bezier(.2,.7,.1,1),filter .8s}
.fig img{width:100%;display:block;mix-blend-mode:multiply}
.count{position:absolute;left:4vw;top:19vh;display:flex;align-items:baseline;gap:12px}
.count b{display:block;font-family:var(--disp);font-weight:200;font-size:clamp(40px,4.6vw,72px);line-height:1}
.count span{font-size:13px;color:var(--mu)}

/* 10 도메인 지식 */
.storm{position:absolute;inset:0}
.storm span{position:absolute;white-space:nowrap;color:#9ea2a8;transition:transform 1.4s cubic-bezier(.2,.7,.1,1),opacity 1s,color .8s,font-size 1s}
.storm span.key{color:var(--ink)}
.confess{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;z-index:2}
.confess .disp{font-size:min(7.6vw,120px)}
.confess p{font-size:15px;color:var(--mu);margin-top:16px}

/* 11 도메인 필터 매트릭스 */
.mtx{position:absolute;left:4vw;right:4vw;top:27vh;bottom:9vh}
.mtx svg{width:100%;height:100%}

/* 12·13 필터 */
.people{position:absolute;inset:20vh 4vw 9vh 4vw;display:grid;gap:2vw;align-items:start}
.person{background:var(--paper);border:1px solid var(--ln);display:grid;grid-template-columns:150px 1fr;gap:18px;padding:16px;align-content:start;transition:opacity .6s,transform .6s}
.person img{width:150px;height:190px;object-fit:cover;filter:grayscale(1) contrast(1.05);display:block;background:#ddd}
.person .who{font-size:12px;color:var(--mu);margin-top:6px;line-height:1.4}
.person h3{margin:0 0 6px;font-size:20px;font-weight:600}
.person p{margin:0 0 10px;font-size:14px;line-height:1.6}
.rule{display:inline-flex;align-items:baseline;gap:8px;font-family:var(--mono);font-size:clamp(20px,1.9vw,30px);border:1px solid var(--ink);padding:6px 12px;margin:4px 8px 4px 0;background:#fff}
.rule small{font-family:var(--body);font-size:12px;color:var(--mu)}
.papers{display:flex;gap:10px;margin-top:10px}
.paper{flex:1;border:1px dashed #9aa0a8;padding:10px 12px;font-size:12.5px;color:var(--mu);line-height:1.45;background:repeating-linear-gradient(135deg,transparent 0 8px,rgba(0,0,0,.025) 8px 16px)}
.mini{width:100%;height:120px;display:block}
.evi{position:absolute;right:4vw;bottom:9vh;width:min(46vw,760px);border:1px solid var(--ln);background:#fff;opacity:0;transform:translateY(16px);transition:opacity .7s,transform .7s}
.evi.on{opacity:1;transform:none}
.evi img{width:100%;display:block}
.evi figcaption{font-size:11.5px;color:var(--mu);padding:6px 10px;border-top:1px solid var(--ln)}

/* 15·16 Rolling */
.ratios{position:absolute;left:6vw;right:6vw;top:34vh;display:grid;gap:26px}
.ratio{display:grid;grid-template-columns:70px 1fr;align-items:center;gap:16px;font-family:var(--mono);font-size:14px}
.ratio .seg{display:flex;height:44px}
.ratio .seg div{display:grid;place-items:center;color:#fff;font-size:13px;font-family:var(--body)}

/* 17 지표 */
.formula{font-family:var(--mono);font-size:clamp(18px,1.7vw,26px);background:#fff;border:1px solid var(--ln);padding:12px 16px;display:inline-block}
.three{position:absolute;inset:22vh 4vw 9vh 4vw;display:grid;grid-template-columns:repeat(3,1fr);gap:2vw}
.three{transition:bottom .6s}.three.short{bottom:44vh}.three.short .mini{height:70px}
.three>div{background:var(--paper);border:1px solid var(--ln);padding:18px;position:relative;transition:opacity .6s}
.three h3{margin:0 0 8px;font-size:18px}
.three p{font-size:13.5px;line-height:1.6;margin:0 0 10px}
.dim{opacity:.28}

/* 18 감쇠 */
.decay{position:absolute;inset:18vh 4vw 9vh 4vw;display:grid;grid-template-columns:260px 1fr;gap:3vw}
.decay img{width:100%;filter:grayscale(1);display:block}
.decay .cap{font-size:12px;color:var(--mu);margin-top:8px;line-height:1.45}

/* 19 끝 */
.flow{position:absolute;left:5vw;right:5vw;top:50%;transform:translateY(-50%);display:grid;grid-template-columns:repeat(6,1fr);gap:0}
.flow div{border-top:2px solid var(--ink);padding:14px 12px 0 0;font-size:14px;line-height:1.55}
.flow b{display:block;font-family:var(--disp);font-weight:300;font-size:13px;letter-spacing:.14em;color:var(--mu);margin-bottom:6px}

/* 발표자 노트 */
#notes{position:fixed;right:18px;bottom:18px;z-index:30;width:min(440px,92vw);background:#111214;color:#e9eaec;padding:14px 16px 12px;font-size:14px;line-height:1.65;box-shadow:0 12px 40px rgba(0,0,0,.3);display:none}
#notes.on{display:block}
#notes .meta{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:#8e939a;margin-bottom:6px}
#help{position:fixed;left:18px;bottom:44px;z-index:30;background:#fff;border:1px solid var(--ln);padding:12px 14px;font-size:12.5px;line-height:1.8;display:none}
#help.on{display:block}#help kbd{font-family:var(--mono);background:#f0f1f3;border:1px solid #d3d5d9;padding:0 5px;margin-right:6px}

@media (max-width:820px){
  .roster{grid-template-columns:repeat(2,1fr);top:58%;gap:8px}.ship{min-height:0;padding:10px 12px}.ship svg.sil{display:none}.ship dl{font-size:11.5px}
  #chapLabel{display:none}#brand span{display:none}.pick-title{top:9vh}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .split,.decay{grid-template-columns:1fr}.three{grid-template-columns:1fr}.people{grid-template-columns:1fr!important}
  .reasons{grid-template-columns:1fr}.flow{grid-template-columns:repeat(2,1fr);gap:18px}
  .alt1-text{width:auto;left:4vw;top:auto;bottom:8vh}
  .person{grid-template-columns:90px 1fr}.person img{width:90px;height:114px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ── 10/10 유지보수 추가분 ── */
/* 표지: 조 이름 */
.team-name{font-family:var(--body);font-weight:300;font-size:min(13vw,200px);line-height:1;margin:18px 0 0;letter-spacing:-.04em;color:#17181b}
.team-name .han{font-weight:200;color:#9ea2a8;font-size:.55em;vertical-align:.35em;margin:0 .04em}
#title-stage .sub{font-size:14px;color:var(--mu);margin-top:10px}
/* 자산 네 칸 */
.assets{position:absolute;left:4vw;right:4vw;top:24vh;bottom:9vh;display:grid;grid-template-columns:repeat(4,1fr);gap:1.6vw}
.asset{background:var(--paper);border:1px solid var(--ln);padding:20px 20px 16px;display:flex;flex-direction:column;min-width:0}
.asset>b{font-family:var(--disp);font-weight:200;font-size:clamp(46px,5.6vw,92px);line-height:1}
.asset>span{display:block;margin:8px 0 14px;font-size:13.5px;color:var(--mu)}
.asset svg{flex:1;width:100%;min-height:0}
.alist{list-style:none;margin:0;padding:0;display:grid;gap:9px;font-size:14.5px}
.alist li{display:flex;align-items:center;gap:10px}.alist i{width:10px;height:10px;border-radius:50%}.alist em{margin-left:auto;font-style:normal;font-family:var(--mono);font-size:12px;color:var(--mu)}
/* 회귀 선언 */
.reg-wrap{text-align:center}
.reg-big{margin:18px 0 0;font-weight:600;font-size:min(10.5vw,168px);line-height:1.02;letter-spacing:-.04em}
.reg-big span{display:block;opacity:0;transform:translateY(40px)}
.reg-wrap.go .reg-big span{animation:rise .9s cubic-bezier(.2,.7,.1,1) forwards}.reg-wrap.go .reg-big span:nth-child(2){animation-delay:.18s}
.reg-line{display:block;height:6px;background:var(--blue);margin:26px auto 0;width:0}
.reg-wrap.go .reg-line{animation:sweep 1.1s .5s cubic-bezier(.2,.7,.1,1) forwards}
@keyframes rise{to{opacity:1;transform:none}}@keyframes sweep{to{width:min(52vw,760px)}}
/* 운임 탐색 */
.fx{position:absolute;left:4vw;right:4vw;top:26vh;bottom:9vh;display:grid;grid-template-columns:1.6fr 1fr;gap:3vw;transition:opacity .6s}
#fxH{position:relative}.fxSide{align-self:center}.small{font-size:13px;color:var(--mu);line-height:1.6}
.exo{position:absolute;left:4vw;right:4vw;top:26vh;bottom:9vh;display:grid;grid-template-columns:1fr 1.5fr;gap:2vw;opacity:0;transition:opacity .6s}
.exo-col h3{margin:0 0 10px;font-size:14px;color:var(--mu);font-weight:500}
.exo-col:last-child{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start}.exo-col:last-child h3{grid-column:1/-1}
.chip{background:var(--paper);border:1px dashed #9aa0a8;padding:10px 12px;margin-bottom:10px}.chip.ok{border:1px solid var(--ink);background:#fff}
.chip b{display:block;font-size:14px;font-weight:600}.chip span{font-size:12px;color:var(--mu)}
/* 참고 논문 · 사례 두 줄 흐름 */
.covrow{position:absolute;left:0;right:0;height:30vh;overflow:hidden;transition:opacity .6s}
.covrow .rowtag{position:absolute;left:4vw;top:-22px;font-family:var(--disp);font-size:11px;letter-spacing:.18em;color:var(--mu)}
.covtrack{display:flex;gap:18px;height:100%;will-change:transform}
.cov{margin:0;flex:0 0 auto;height:100%;width:calc(30vh * .78);background:#fff;border:1px solid var(--ln);display:flex;flex-direction:column;box-shadow:0 8px 22px rgba(0,0,0,.06)}
.cov img{flex:1;min-height:0;width:100%;object-fit:cover;object-position:top;filter:grayscale(.15)}
.cov figcaption{padding:7px 9px;font-size:11px;line-height:1.35;color:#30343a;border-top:1px solid var(--ln);height:52px;overflow:hidden}.cov figcaption b{display:block;font-size:11.5px}
.cov.typo .tp{flex:1;padding:16px 14px;display:flex;flex-direction:column;gap:10px;background:linear-gradient(160deg,#16181c,#2a2e35);color:#e9eaec}
.cov.typo .tp span{font-family:var(--disp);font-size:9.5px;letter-spacing:.16em;color:#9ea4ad;text-transform:uppercase}.cov.typo .tp b{font-size:15px;line-height:1.35}.cov.typo .tp em{margin-top:auto;font-style:normal;font-size:11px;color:#b9bec6}
.covrow.dimrow{opacity:.35}
/* 변수 탐색 단계 */
.stages{position:absolute;left:4vw;right:4vw;top:27vh;display:grid;grid-template-columns:repeat(4,1fr);gap:1.4vw;transition:top .7s}
.stages.up{top:20vh}
.stg{border-top:3px solid #c9ccd1;padding:14px 4px 0 0;opacity:.25;transform:translateY(14px);transition:opacity .6s,transform .6s,border-color .6s}
.stg.on{opacity:1;transform:none}.stg.cur{border-color:var(--blue)}
.stg b{font-family:var(--disp);font-weight:200;font-size:44px;line-height:1}.stg h3{margin:8px 0 6px;font-size:20px}.stg p{margin:0 0 8px;font-size:14px;line-height:1.6}.stg em{font-style:normal;font-size:12.5px;color:var(--mu)}
.chain{position:absolute;left:4vw;right:4vw;top:54vh;display:flex;align-items:stretch;gap:8px;opacity:0;transform:translateY(20px);transition:opacity .7s,transform .7s}
.chain.on{opacity:1;transform:none}.chain>i{align-self:center;font-style:normal;color:var(--mu)}

<header id="top"><div id="brand">선(船)견지명 <span>3조 · 선박 수주 예측 · 데이터 이야기</span></div><div id="shipBadge" aria-live="polite" title="현재 선종 · 숫자 키 1–5로 변경"><svg viewBox="0 0 186 82" aria-hidden="true"></svg><span><em>지금 보는 선종</em><b></b></span><i></i></div><div id="chapLabel"></div></header><div id="shipToast"></div>

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="story/data.js"></script>
<script>
"use strict";
const S=window.STORY, $=s=>document.querySelector(s);
const SHIPS=S.ships, UNIT=S.unit;
const SHIP_COLOR={"컨테이너선":"#296EF9","벌크선":"#1F8A5B","유조선":"#C8323C","가스 운반선":"#7B4FD6","케미컬 탱커":"#D98A1E"};
const CL_COLOR={1:"#296EF9",2:"#9AA3AE",3:"#D98A1E"};
const fmt=d3.format(","), fmt2=d3.format(".2f"), pct=d3.format(".0%");
let ship=(()=>{try{return localStorage.getItem("story.ship")||SHIPS[0]}catch(e){return SHIPS[0]}})();
let alt=(()=>{try{return localStorage.getItem("story.alt")||"1"}catch(e){return "1"}})();
const F=()=>S.features[ship];
const listeners=[];
function setShip(s){ship=s;try{localStorage.setItem("story.ship",s)}catch(e){}listeners.forEach(f=>f());}

/* 어절 단위 말줄임: 공백 경계에서 자르고, 공백 없는 긴 단어만 글자 단위로 자른다 (CLAUDE.md) */
function clip(t,max){if(t.length<=max)return t;const w=t.split(" ");let o="";for(const x of w){if((o+" "+x).trim().length>max-1)break;o=(o+" "+x).trim();}return (o||t.slice(0,max-1))+"…";}
function months(){return F().months.map(m=>new Date(+m.slice(0,4),+m.slice(5,7)-1,1));}
function box(el){const r=el.getBoundingClientRect();return {w:r.width||320,h:r.height||240};}
function svgIn(el){d3.select(el).selectAll("svg").remove();const {w,h}=box(el);return {svg:d3.select(el).append("svg").attr("viewBox",`0 0 ${w} ${h}`).attr("preserveAspectRatio","none"),w,h};}

/* ───────────── 장 정의 ─────────────
   각 장: id · 라벨 · 단계(카드 문구·발표자 노트) · mount(무대) · update(단계 번호) */
const CH=[];

/* 0 표지 — 조 이름을 그대로 크게 */
CH.push({id:"title",label:"Intro",steps:[{note:"안녕하세요, 3조 선(船)견지명입니다. 선견지명의 '먼저 선(先)'을 '배 선(船)'으로 바꿔, 배의 수주를 미리 내다보겠다는 뜻을 담았습니다. 오늘은 우리가 모은 데이터가 어떻게 '수주 예측이 해볼 만한 문제'로 좁혀졌는지 따라가 보겠습니다."}],
 mount(st){st.id="title-stage";st.innerHTML=`<div><span class="eyebrow">Team 03 · Ship order forecasting</span>
  <p class="team-name">선<span class="han">(船)</span>견지명</p>
  <p class="lead" style="margin:18px auto 0">先見之明의 <b>先</b>을 배 <b>船</b>으로 — 다음 수주를 먼저 읽는다</p>
  <p class="sub">선종 5개 · 2015년부터 매달 · 공개 지표만으로 3개월 뒤 신규 수주량 예측</p></div>`;},update(){}});

/* 1 데이터 자산 — 숫자 네 개를 각각의 미니 시각화로 */
const VGROUPS=[["원유·에너지",/원유|천연가스|LNG/],["원자재",/비에너지|비철|고무|면화|팜유|대두|철광석|석탄|곡물|밀|옥수수|구리|알루미늄|원자재/],["벙커유",/벙커유/],["신조선가",/신조선가/],["운임",/운임|BDI|WS/],["선복량",/선복량/],["교역·생산",/수출|수입|산업생산|처리량/],["공급망",/공급망/],["지정학",/GPR/],["무역정책",/TPU/]];
CH.push({id:"assets",label:"Data assets",
 steps:[{note:"먼저 우리가 가진 재료입니다. 선종 다섯 개, 2015년부터 141개월, 선종별로 조합한 원천 변수, 그리고 이걸 모두 합친 관측값입니다. 각 숫자 아래에 그 숫자가 어떻게 구성되는지 같이 보여 드립니다."},
        {card:"<span class='k'>Skim</span>지나가는 이름들은 우리가 실제로 모으고 검토한 변수·원천 시리즈 <b>"+S.explored.names.length+"개</b>입니다. 진하게 보이는 것이 지금 선택한 선종의 마스터 테이블 변수입니다.",side:"b",note:"지나가는 이름들은 전부 우리가 실제로 모으거나 검토한 변수입니다. 운임 노선, 원자재, 물동량, 나라별 지정학 위험까지. 그중 진하게 보이는 것이 최종 마스터 테이블에 들어간 변수입니다."}],
 mount(st){
  const all=new Set();SHIPS.forEach(s=>S.features[s].series.slice(1).forEach(x=>all.add(x.name)));const names=[...all];
  const obs=SHIPS.map(s=>({s,n:S.features[s].series.reduce((b,x)=>b+x.raw.filter(v=>v!=null).length,0)}));const pts=d3.sum(obs,d=>d.n);
  const grp=VGROUPS.map(([g,re])=>({g,n:names.filter(n=>re.test(n)).length})).filter(d=>d.n);
  const span=SHIPS.map(s=>{const f=S.features[s];const i0=f.orders.findIndex(v=>v!=null);return {s,first:f.months[i0],last:f.months[f.orders.length-1-[...f.orders].reverse().findIndex(v=>v!=null)]};});
  st.innerHTML=`<div class="title-tl"><span class="eyebrow">Data assets</span><h2 class="h2">우리가 모은 재료</h2></div>
  <div class="assets fade" id="kp">
   <div class="asset"><b>5</b><span>선종 · 단위가 다르다</span><ul class="alist">${SHIPS.map(s=>`<li><i style="background:${SHIP_COLOR[s]}"></i>${s}<em>${UNIT[s]}</em></li>`).join("")}</ul></div>
   <div class="asset"><b>141</b><span>개월 · 2015-01 ~ 2026-09</span><svg id="aSpan"></svg></div>
   <div class="asset"><b>${names.length}</b><span>원천 변수 · 10개 범주</span><svg id="aGrp"></svg></div>
   <div class="asset"><b>${fmt(pts)}</b><span>관측값 · 선종별</span><svg id="aObs"></svg></div></div>`;
  this.span=span;this.grp=grp;this.obs=obs;
  const pool=[...new Set([...names,...S.explored.names])];const ROWS=12,FS=[30,15,22,13,34,17,24,14,28,16,20,13];
  for(let r=0;r<ROWS;r++){const d=document.createElement("div");d.className="marq dense";d.style.top=(7+r*7.4)+"vh";d.style.fontSize=`clamp(${Math.round(FS[r]*.6)}px,${(FS[r]/14.4).toFixed(2)}vw,${FS[r]+6}px)`;d.style.opacity=0;d.dataset.sp=(.6+((r*37)%10)/10).toFixed(2);
   const pick=d3.shuffle(pool.slice()).slice(0,70);const seq=pick.concat(pick);d.innerHTML=seq.map(n=>`<span data-n="${n}">${n.replace(/_/g," ")}</span>`).join("");st.appendChild(d);}
  this.st=st;this.anim=null;listeners.push(()=>this.paint());},
 paint(){const st=this.st;
  const mk=(id)=>{const el=st.querySelector(id);const r=el.getBoundingClientRect();const w=r.width||260,h=r.height||170;const svg=d3.select(el).attr("viewBox",`0 0 ${w} ${h}`);svg.selectAll("*").remove();return {svg,w,h};};
  {const {svg,w,h}=mk("#aSpan");const x=d3.scaleTime().domain([new Date(2015,0,1),new Date(2026,9,1)]).range([4,w-4]);const rh=(h-24)/5;
   this.span.forEach((d,k)=>{const a=new Date(+d.first.slice(0,4),+d.first.slice(5)-1,1),b=new Date(+d.last.slice(0,4),+d.last.slice(5),1);
    svg.append("rect").attr("x",x(a)).attr("width",x(b)-x(a)).attr("y",k*rh+3).attr("height",rh-7).attr("fill",d.s===ship?SHIP_COLOR[d.s]:"#c4c8ce");
    svg.append("text").attr("x",x(a)+4).attr("y",k*rh+rh/2+3).attr("font-size",10.5).attr("fill","#fff").text(`${d.first} →`);});
   svg.append("g").attr("class","axis").attr("transform",`translate(0,${h-18})`).call(d3.axisBottom(x).ticks(d3.timeYear.every(3)).tickFormat(d3.timeFormat("%Y")).tickSizeOuter(0));}
  {const {svg,w,h}=mk("#aGrp");const g=d3.sort(this.grp,d=>-d.n);const x=d3.scaleLinear().domain([0,d3.max(g,d=>d.n)]).range([0,w-104]);const rh=h/g.length;
   g.forEach((d,k)=>{svg.append("text").attr("x",76).attr("y",k*rh+rh*.68).attr("text-anchor","end").attr("font-size",11).attr("fill","#30343a").text(d.g);
    svg.append("rect").attr("x",82).attr("y",k*rh+2).attr("height",rh-4).attr("width",x(d.n)).attr("fill","#111214");
    svg.append("text").attr("x",86+x(d.n)).attr("y",k*rh+rh*.68).attr("font-size",10.5).attr("fill","#6b6f76").text(d.n);});}
  {const {svg,w,h}=mk("#aObs");const x=d3.scaleLinear().domain([0,d3.max(this.obs,d=>d.n)]).range([0,w-118]);const rh=h/5;
   this.obs.forEach((d,k)=>{svg.append("text").attr("x",76).attr("y",k*rh+rh*.62).attr("text-anchor","end").attr("font-size",11).attr("fill","#30343a").text(d.s);
    svg.append("rect").attr("x",82).attr("y",k*rh+4).attr("height",rh-8).attr("width",x(d.n)).attr("fill",d.s===ship?SHIP_COLOR[d.s]:"#9aa1ab");
    svg.append("text").attr("x",86+x(d.n)).attr("y",k*rh+rh*.62).attr("font-size",10.5).attr("fill","#6b6f76").attr("font-family","JetBrains Mono").text(fmt(d.n));});}},
 leave(){cancelAnimationFrame(this.anim);},
 update(i){const kp=this.st.querySelector("#kp"),mq=this.st.querySelectorAll(".marq");this.paint();
  kp.style.opacity=i===0?1:0;this.st.querySelector(".title-tl").style.opacity=i===0?1:0;
  const mine=new Set(F().series.map(x=>x.name));
  mq.forEach(m=>{m.style.opacity=i===1?1:0;m.querySelectorAll("span").forEach(s=>s.classList.toggle("hl",mine.has(s.dataset.n)));});
  cancelAnimationFrame(this.anim);
  if(i===1){const t0=performance.now();const W=[...mq].map(m=>m.scrollWidth/2);
   const tick=t=>{if(CH[curC]!==this)return;mq.forEach((m,k)=>{const dir=k%2?1:-1;const x=((t-t0)*0.05*(+m.dataset.sp))%W[k];m.style.transform=`translateX(${dir<0?-x:x-W[k]}px)`;});this.anim=requestAnimationFrame(tick);};this.anim=requestAnimationFrame(tick);}}});

/* 2 캐릭터 선택 */
/* 선종 픽토그램(측면 단색 형식 유지, 세부 고도화): 공통 선체·선저 도장·거주구·연돌·마스트 + 선종별 화물부 */
function shipPict(type,k){const H="#15171b",SC=SHIP_COLOR[type]||"#555",W="#ecebe6",id="hc"+k;
 const hull=type==="케미컬 탱커"?"#1d2c44":H;
 const hp="M10 54 L168 54 L181 46.5 L177 60 Q173 72.5 160 74 L22 74 Q13.5 74 11.8 67 Z";
 let g=`<path d="M4 77.5 q6 -2 12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0" fill="none" stroke="#c9d1da" stroke-width="1"/>`;
 // 선체 · 구상선수 · 선저 도장 · 흘수선 · 현측 줄
 g+=`<clipPath id="${id}"><path d="${hp}"/><ellipse cx="174.5" cy="70" rx="6.5" ry="3.6"/></clipPath>`;
 g+=`<path d="${hp}" fill="${hull}"/><ellipse cx="174.5" cy="70" rx="6.5" ry="3.6" fill="${hull}"/>`;
 g+=`<g clip-path="url(#${id})"><rect x="0" y="69.2" width="190" height="10" fill="#a3333b"/><rect x="0" y="68.2" width="190" height="1" fill="#e8e4dc"/></g>`;
 g+=`<path d="M12.6 57.6 H170.5 L179.2 51" fill="none" stroke="${type==="케미컬 탱커"?"#3c5578":"#3a3e46"}" stroke-width=".8"/>`;
 g+=`<circle cx="169.5" cy="58.5" r="1.3" fill="#8b9097"/><path d="M168 59.6 l1.5 3 1.5 -3" fill="none" stroke="#8b9097" stroke-width=".5"/>`;
 // 타 · 프로펠러
 g+=`<path d="M10.5 66 h4.2 v9.5 h-4.2z" fill="${hull}"/><circle cx="19.5" cy="71.2" r="2.4" fill="#7b7f86"/><path d="M19.5 68.4 v5.6 M17 71.2 h5" stroke="${hull}" stroke-width=".6"/>`;
 // 선수루 · 선수 마스트 · 계류
 g+=`<path d="M156 54 V50.5 H170.5 L176 48" fill="none" stroke="#3a3e46" stroke-width=".7"/><line x1="171" y1="47.5" x2="171" y2="35" stroke="${H}" stroke-width="1"/><circle cx="171" cy="35" r=".9" fill="#d6b44a"/>`;
 // 거주구(선미) · 창문 · 브리지 윙 · 연돌 · 레이더 마스트
 const sx=14,sw=26,top=type==="유조선"||type==="벌크선"?24:type==="컨테이너선"?20:28;
 g+=`<rect x="${sx}" y="${top}" width="${sw}" height="${54-top}" fill="${W}" stroke="${H}" stroke-width=".7"/>`;
 for(let y=top+6;y<52;y+=5)g+=`<line x1="${sx}" y1="${y}" x2="${sx+sw}" y2="${y}" stroke="#b9b6ad" stroke-width=".4"/>`+[0,1,2,3,4].map(c=>`<rect x="${sx+2.5+c*4.6}" y="${y-3.2}" width="2.6" height="1.8" fill="#3d4c63"/>`).join("");
 g+=`<rect x="${sx-4}" y="${top}" width="${sw+8}" height="3.4" fill="${H}"/><rect x="${sx+1}" y="${top+.8}" width="${sw-2}" height="1.4" fill="#6f8db3"/>`;
 g+=`<path d="M${sx+4} ${top} L${sx+6} ${top-12} H${sx+15} L${sx+15.5} ${top}" fill="${W}" stroke="${H}" stroke-width=".7"/><rect x="${sx+5.4}" y="${top-8.5}" width="9.8" height="3" fill="${SC}"/><rect x="${sx+5.8}" y="${top-13.5}" width="9.4" height="2.2" fill="${H}"/>`;
 g+=`<line x1="${sx+20}" y1="${top}" x2="${sx+20}" y2="${top-14}" stroke="${H}" stroke-width="1"/><rect x="${sx+16.5}" y="${top-11}" width="7" height="1.4" fill="${H}"/><line x1="${sx+17}" y1="${top-6}" x2="${sx+23}" y2="${top-6}" stroke="${H}" stroke-width=".6"/>`;
 g+=`<rect x="${sx+sw}" y="44" width="5" height="10" fill="#d9d6ce" stroke="${H}" stroke-width=".5"/><path d="M${sx+sw+1} 44 v-3 h3 v3" fill="none" stroke="${H}" stroke-width=".5"/>`;
 // 선종별 화물부
 if(type==="컨테이너선"){const P=["#5c6a80","#8a4b42","#4d6b5a","#b08a3e","#3f5b7a","#7a7f87","#6a5a7d","#9b6b3d"];
  for(let b=0;b<9;b++){const x=48+b*13.3,tiers=b===0?4:b===8?3:5+(b%3===1?1:0);
   for(let t=0;t<tiers;t++){const c=P[(b*3+t*5)%P.length];g+=`<rect x="${x}" y="${53.6-(t+1)*5}" width="12.6" height="4.7" fill="${c}" stroke="${H}" stroke-width=".35"/><line x1="${x+1.5}" y1="${53.6-(t+1)*5+2.35}" x2="${x+11}" y2="${53.6-(t+1)*5+2.35}" stroke="rgba(255,255,255,.18)" stroke-width=".5"/>`;}
   if(b%2===0)g+=`<rect x="${x-1}" y="${53.6-tiers*5-1}" width=".8" height="${tiers*5+1}" fill="${H}"/>`;}
  g+=`<path d="M46 54 v-6 h3" fill="none" stroke="${H}" stroke-width=".7"/>`;}
 else if(type==="벌크선"){for(let h=0;h<6;h++){const x=48+h*18.5;g+=`<path d="M${x} 54 v-3 q0 -3 3 -3 h9 q3 0 3 3 v3z" fill="#5f6d61" stroke="${H}" stroke-width=".5"/>`+[1,2,3].map(r=>`<line x1="${x+r*3.8}" y1="48.6" x2="${x+r*3.8}" y2="54" stroke="#465247" stroke-width=".5"/>`).join("");}
  [0,1,2,3].map(c=>48+18.5*(c+1)-2).forEach((x,c)=>{g+=`<rect x="${x-1.4}" y="40" width="2.8" height="14" fill="#c99a2e" stroke="${H}" stroke-width=".4"/><rect x="${x-2.6}" y="37" width="5.2" height="4" fill="#c99a2e" stroke="${H}" stroke-width=".4"/><line x1="${x}" y1="38" x2="${x+15}" y2="${24+(c%2)*3}" stroke="#c99a2e" stroke-width="1.6"/><line x1="${x+15}" y1="${24+(c%2)*3}" x2="${x+15}" y2="${36+(c%2)*3}" stroke="${H}" stroke-width=".4"/><path d="M${x+13.6} ${36+(c%2)*3} h2.8 l-1.4 2z" fill="${H}"/>`;});}
 else if(type==="유조선"){g+=`<line x1="46" y1="50.5" x2="164" y2="50.5" stroke="#7a5555" stroke-width="2.2"/><line x1="46" y1="47.6" x2="164" y2="47.6" stroke="${H}" stroke-width=".7" stroke-dasharray="2 1"/>`;
  for(let x=50;x<164;x+=7)g+=`<line x1="${x}" y1="47.6" x2="${x}" y2="54" stroke="${H}" stroke-width=".5"/>`;
  [64,84,124,144].forEach(x=>g+=`<rect x="${x-3}" y="51.5" width="6" height="2.5" fill="#cfcac0" stroke="${H}" stroke-width=".4"/>`);
  g+=`<rect x="100" y="44" width="10" height="10" fill="none" stroke="${H}" stroke-width=".6"/>`+[101.5,104,106.5,109].map(x=>`<line x1="${x}" y1="44" x2="${x}" y2="40.5" stroke="#7a5555" stroke-width="1"/>`).join("");
  g+=`<rect x="114" y="38" width="2.4" height="16" fill="#c99a2e"/><line x1="115.2" y1="39" x2="126" y2="33" stroke="#c99a2e" stroke-width="1.4"/><rect x="90" y="38" width="2.4" height="16" fill="#c99a2e"/><line x1="91.2" y1="39" x2="80" y2="33" stroke="#c99a2e" stroke-width="1.4"/>`;}

function drawRidges(el,opt={}){
 const {svg,w,h}=svgIn(el);const f=F();const ms=months();
 const lab=opt.labW??Math.min(230,w*.26),top=opt.top??10,bot=opt.bot??26;
 const ser=f.series, n=ser.length, band=(h-top-bot)/n, amp=band*(opt.amp??2.2);
 const x=d3.scaleTime().domain(d3.extent(ms)).range([lab,w-8]);
 const g=svg.append("g");
 // 뒤에 비치는 데이터셋: 연 평균 원값을 행마다 흐리게
 const grid=svg.append("g").attr("class","grid").attr("opacity",0);
 const years=d3.range(2015,2027);
 ser.forEach((s,i)=>{const y0=top+band*(i+1);years.forEach(yr=>{const vals=s.raw.filter((v,k)=>v!=null&&ms[k].getFullYear()===yr);if(!vals.length)return;const m=d3.mean(vals);
   grid.append("text").attr("class","gridnum").attr("x",x(new Date(yr,6,1))).attr("y",y0-3).attr("text-anchor","middle").text(Math.abs(m)>=1e5?d3.format(".3s")(m):Math.abs(m)>=100?fmt(Math.round(m)):d3.format(".3~g")(m));});});
 const hl=new Set(opt.hl||[]);
 const area=d3.area().defined(d=>d!=null).x((d,k)=>x(ms[k])).y1(d=>-d*amp).y0(0).curve(d3.curveMonotoneX);
 const line=d3.line().defined(d=>d!=null).x((d,k)=>x(ms[k])).y(d=>-d*amp).curve(d3.curveMonotoneX);
 const rows=g.selectAll("g.row").data(ser).join("g").attr("class","row").attr("transform",(d,i)=>`translate(0,${top+band*(i+1)})`);
 rows.append("path").attr("class","fill").attr("d",d=>area(d.v));
 rows.append("path").attr("class","stroke").attr("d",d=>line(d.v)).attr("fill","none");
 rows.append("text").attr("class","ridge-lab").attr("x",lab-10).attr("y",-2).attr("text-anchor","end").text(d=>clip(d.name==="수주용량"?`수주용량 (${UNIT[ship]})`:d.label,opt.clip??30));

 return {svg,g,rows,grid,x,ser,band,top,lab,w,h};
}

/* 13 필터 2: Pearson · Spearman · MI — 예시 산점도마다 r·ρ·MI를 직접 계산해 표시(매칭 검증) · MI 카드에는 I(r) = −½ln(1−r²) 곡선 */
const F2D=(()=>{const rnd=d3.randomNormal.source(d3.randomLcg(11))(0,1);const mk=f=>d3.range(120).map(k=>{const x=k/119*2-1;return [x,f(x,rnd())];});

  this.tm=setInterval(()=>{const k=(performance.now()-t0)/(A.dur*1000);this.st.querySelector("#qaBar").style.width=Math.min(100,k*100)+"%";if(k>=1&&this.on)this.next();},250);}});

/* ───────────── 엔진 ───────────── */
const deck=$("#deck"),dots=$("#dots");const flat=[];
CH.forEach((c,ci)=>{const sec=document.createElement("section");sec.className="chap";sec.id="ch-"+c.id;sec.setAttribute("aria-label",c.label);
 const st=document.createElement("div");st.className="stage";sec.appendChild(st);const steps=document.createElement("div");steps.className="steps";
 c.steps.forEach((s,si)=>{const d=document.createElement("div");d.className="step "+(c.cardSide||s.side||"");d.dataset.c=ci;d.dataset.s=si;
  if(s.card!==undefined&&(s.card||s.dyn!==undefined)){const cd=document.createElement("div");cd.className="card";cd.innerHTML=s.card;d.appendChild(cd);}steps.appendChild(d);flat.push(d);});
 sec.appendChild(steps);deck.appendChild(sec);c.stage=st;c.sec=sec;
 const b=document.createElement("button");b.setAttribute("aria-label",c.label);b.title=c.label;b.onclick=()=>go(flat.findIndex(e=>+e.dataset.c===ci));dots.appendChild(b);});
CH.forEach(c=>c.mount(c.stage));
let cur=-1,curC=-1,t0=Date.now();
function cardFor(el){const c=CH[+el.dataset.c],s=c.steps[+el.dataset.s];const cd=el.querySelector(".card");if(cd&&s.dyn!==undefined&&c.dyn)cd.innerHTML=c.dyn(s.dyn);}
function activate(k){if(k===cur)return;cur=k;const el=flat[k];const ci=+el.dataset.c,si=+el.dataset.s;const c=CH[ci];
 cardFor(el);if(curC!==ci&&CH[curC]&&CH[curC].leave)CH[curC].leave();curC=ci;c.update(si);$("#chapLabel").textContent=`${String(ci).padStart(2,"0")} · ${c.label}`;
 dots.querySelectorAll("button").forEach((b,j)=>b.classList.toggle("on",j===ci));$("#prog").style.width=(100*k/(flat.length-1))+"%";
 $("#nMeta").textContent=`${ci}.${si+1} · ${c.label} · ${k+1}/${flat.length}`;$("#nText").textContent=c.steps[si].note||"";$("#hint").style.opacity=k===0?1:0;}
/* 현재 단계 = 화면 가운데에 가장 가까운 단계 (IntersectionObserver는 발표 화면 공유·백그라운드 탭에서 멈출 수 있어 직접 계산) */
let lock=0;
function nearest(){const mid=innerHeight/2;let best=0,d=1e9;flat.forEach((e,k)=>{const r=e.getBoundingClientRect();const dd=Math.abs(r.top+r.height/2-mid);if(dd<d){d=dd;best=k;}});return best;}
let ticking=false;addEventListener("scroll",()=>{if(ticking)return;ticking=true;requestAnimationFrame(()=>{ticking=false;if(Date.now()<lock)return;activate(nearest());});},{passive:true});
function go(k){k=Math.max(0,Math.min(flat.length-1,k));const el=flat[k];const y=el.getBoundingClientRect().top+scrollY-(innerHeight-el.offsetHeight)/2;
 lock=Date.now()+900;activate(k);window.scrollTo({top:y,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
 setTimeout(()=>{if(Math.abs(scrollY-y)>4)window.scrollTo(0,y);},950);}
listeners.push(()=>{if(cur>=0){const el=flat[cur];cardFor(el);}});
addEventListener("keydown",e=>{if(e.target.closest&&e.target.closest("input,textarea"))return;
 if(["ArrowDown","PageDown"," "].includes(e.key)){e.preventDefault();go(cur+1);}
 else if(["ArrowUp","PageUp"].includes(e.key)){e.preventDefault();go(cur-1);}
 else if(e.key==="Home"){e.preventDefault();go(0);}else if(e.key==="End"){e.preventDefault();go(flat.length-1);}
 else if(e.key==="n"||e.key==="N"){$("#notes").classList.toggle("on");}
 else if(e.key==="?"){$("#help").classList.toggle("on");}
 else if(e.key==="a"||e.key==="A"){setAlt(alt==="1"?"2":"1");}
 else if(/^[1-5]$/.test(e.key)&&CH[curC]&&curC>=CH.findIndex(c=>c.id==="pick")){setShip(SHIPS[+e.key-1]);}});
setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);$("#nTime").textContent=`${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;},1000);
let rz;addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{listeners.forEach(f=>f());if(cur>=0){const el=flat[cur];CH[+el.dataset.c].update(+el.dataset.s);}},200);});
activate(0);

/* 현재 선종 배지: 선종 선택 이후 모든 장에서 상단에 표시 · 바꾸면 알림 */
const PICK_AT=CH.findIndex(c=>c.id==="pick");let lastShip=ship;
function paintBadge(){const b=$("#shipBadge");const on=curC>PICK_AT&&CH[curC]&&!["qa","team","service","end"].includes(CH[curC].id);b.classList.toggle("on",on);
 b.style.setProperty("--sc",SHIP_COLOR[ship]);b.querySelector("svg").innerHTML=SIL[ship];b.querySelector("b").textContent=ship;b.querySelector("i").textContent=`${UNIT[ship]} · ${SHIPS.indexOf(ship)+1}/5`;
 if(ship!==lastShip){lastShip=ship;b.classList.remove("flash");void b.offsetWidth;b.classList.add("flash");const t=$("#shipToast");t.innerHTML=`<svg viewBox="0 0 186 82">${SIL[ship]}</svg><span>선종 변경 → <b style="color:${SHIP_COLOR[ship]}">${ship}</b> · 이후 모든 차트가 ${ship} 기준</span>`;t.classList.remove("on");void t.offsetWidth;t.classList.add("on");}}
{const __act=activate;activate=k=>{__act(k);paintBadge();};}
listeners.push(paintBadge);paintBadge();
</script>
