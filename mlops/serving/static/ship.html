<meta charset="utf-8">
<title>선(船)견지명 수주 관제</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 한국어는 어절 단위로 줄바꿈 (CLAUDE.md 표기 규칙) */
html{word-break:keep-all;overflow-wrap:break-word;line-break:strict}

/* 야간 조선소 관제: 흑청 바탕 · 나트륨 호박색(크레인·예측기준일) · 선종 5색. 3D 도크가 주인공, 오른쪽 계기판, 아래 타임라인.
   관제 화면이라 어두운 톤 하나로 고정한다. */
:root{
  --bg:#05080c;--panel:#0a0f15;--panel2:#101720;--line:#18222d;--line2:#253240;
  --fg:#e6ebef;--muted:#93a1ad;--dim:#5d6c79;--amber:#ffae42;
  --c0:#4aa3ff;--c1:#c38bff;--c2:#ff5d6c;--c3:#e0804f;--c4:#3fd6c8;
  --ok:#4fd18e;--warn:#ffc04d;--bad:#ff5b5b;
  --f-disp:"Saira Condensed","Arial Narrow",system-ui,sans-serif;--f-body:"IBM Plex Sans KR",system-ui,"Malgun Gothic",sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;--r:8px;
  color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:13px;line-height:1.45}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:12px;padding:12px 16px 28px;max-width:1880px;margin:0 auto}
header{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:30px;height:30px;border:2px solid var(--amber);border-radius:4px;position:relative;flex:none}
.mark::before{content:"";position:absolute;left:3px;right:3px;top:6px;height:3px;background:var(--amber)}
.mark::after{content:"";position:absolute;left:5px;width:3px;top:6px;bottom:3px;background:var(--amber);box-shadow:14px 0 0 var(--amber)}
h1{font-family:var(--f-disp);font-weight:700;font-size:26px;letter-spacing:.02em;margin:0;line-height:1}
h1 small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0;margin-top:4px}
.st{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px}
.st i{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
.st.live i{background:var(--ok);box-shadow:0 0 10px var(--ok);animation:blink 1.6s infinite}
.st.snap i{background:var(--warn)}
@keyframes blink{50%{opacity:.35}}
.ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-left:auto}
button{font:inherit;color:var(--fg);background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:6px 11px;cursor:pointer;line-height:1.2}
button:hover{border-color:var(--amber)}
/* 서버(/ship) 화면 이동 — 관제 콘솔 · Kedro 파이프라인 · MLflow 실험 기록 (통합 관제 /ship/ops 의 해당 탭으로) */
.ctl a.go{font:inherit;font-size:13px;color:var(--fg);background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:6px 11px;text-decoration:none;line-height:1.2;white-space:nowrap}
.ctl a.go:hover{border-color:var(--amber)}.ctl a.go:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
button[aria-pressed="true"]{background:#2a1d0b;border-color:var(--amber);color:#ffd9a3}
.clock{font-family:var(--f-mono);color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.stage{position:relative;min-width:0;height:clamp(440px,66vh,820px);border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:#04070a}
.stage.max{position:fixed;inset:0;height:auto;z-index:50;border-radius:0}
.stage canvas{display:block;width:100%;height:100%}
.lbl{font-family:var(--f-mono);font-size:11px;color:var(--c,#ffae42);white-space:nowrap;text-shadow:0 0 6px #000,0 0 2px #000;pointer-events:none}
.lbl.lname{font-family:var(--f-body);font-weight:700;font-size:14px;padding:1px 7px;border-left:3px solid var(--c);background:rgba(5,9,13,.65)}
.lbl.fc{font-family:var(--f-disp);font-size:17px;font-weight:600;padding:2px 7px;border:1px solid var(--c);border-radius:4px;background:rgba(5,8,12,.78);transition:opacity .3s}
.lbl.fc small{font-family:var(--f-mono);font-size:10px;color:var(--muted);margin-left:5px;font-weight:400}
.lbl.fc.dim{opacity:.32}
.hudtl{position:absolute;left:14px;top:12px;display:grid;gap:2px;pointer-events:none}
.hudtl .k{font-family:var(--f-mono);font-size:11px;letter-spacing:.18em;color:var(--amber)}
.hudtl .t{font-family:var(--f-disp);font-size:30px;font-weight:700;line-height:1;text-shadow:0 0 12px rgba(0,0,0,.8)}
.hudtl .s{font-family:var(--f-mono);font-size:11.5px;color:#cfdbe4}
.viewbar{position:absolute;right:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.viewbar button{background:rgba(10,15,21,.82);font-size:12px}
.hbar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:6px 8px 6px 14px;background:rgba(8,12,17,.86);border:1px solid var(--line2);border-radius:999px}
.hbar .k{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.hbar button{border-radius:999px;font-family:var(--f-disp);font-size:16px;font-weight:600;padding:4px 16px}
.cine{position:absolute;left:18px;bottom:76px;display:grid;gap:3px;padding:11px 36px 13px 16px;border-left:3px solid var(--amber);background:linear-gradient(90deg,rgba(3,8,12,.92),rgba(3,8,12,.55) 72%,rgba(3,8,12,0));pointer-events:none;max-width:min(640px,calc(100% - 40px))}
.cine-k{font-family:var(--f-mono);font-size:11px;letter-spacing:.2em;color:var(--amber)}.cine-t{font-size:21px;font-weight:700;color:#fff}.cine-s{font-family:var(--f-mono);font-size:12px;color:#cfdbe4}
.cine-bar{height:2px;background:rgba(255,255,255,.15);margin-top:5px}.cine-bar i{display:block;height:100%;width:0;background:var(--amber)}
.lbox::before,.lbox::after{content:"";position:absolute;left:0;right:0;height:0;background:#000;transition:height .7s ease;pointer-events:none;z-index:2}
.lbox::before{top:0}.lbox::after{bottom:0}
.lbox.on::before,.lbox.on::after{height:5.5%}
.banner{position:absolute;top:118px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;padding:7px 14px;border-radius:6px;background:rgba(45,26,4,.93);border:1px solid var(--warn);color:#ffe2a8;font-weight:600;font-size:12.5px;max-width:calc(100% - 24px);z-index:3;animation:bin .35s ease}
@keyframes bin{from{opacity:0;transform:translate(-50%,-8px)}}
.flash{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(255,174,66,.0),rgba(255,174,66,.16));opacity:0;transition:opacity .5s}
.flash.on{opacity:1;transition:none}
aside{grid-row:span 2;display:grid;gap:12px;align-content:start;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px}
.panel h2{font-size:12px;font-weight:600;color:var(--muted);margin:0 0 8px;letter-spacing:.04em}
.fc .ttl{font-weight:600;font-size:14px}
.big{font-family:var(--f-disp);font-size:46px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums;color:var(--cc,#fff);text-shadow:0 0 22px color-mix(in srgb,var(--cc,#fff) 45%,transparent)}
.big small{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-weight:400;margin-left:6px;text-shadow:none}
.rbar{position:relative;height:12px;border-radius:6px;background:var(--panel2);border:1px solid var(--line2);margin:10px 0 4px}
.rfill{position:absolute;top:1px;bottom:1px;border-radius:5px;background:color-mix(in srgb,var(--cc,#4aa3ff) 40%,transparent);transition:left .6s ease,width .6s ease}
.rpt{position:absolute;top:-4px;width:3px;height:18px;background:var(--cc,#fff);box-shadow:0 0 8px var(--cc,#fff);transform:translateX(-1px);transition:left .6s ease}
.rbase{position:absolute;bottom:-9px;width:0;height:0;border:6px solid transparent;border-bottom-color:var(--amber);transform:translateX(-6px);transition:left .6s ease}
.rlab{display:flex;justify-content:space-between;gap:8px;font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-top:8px}
.kv{display:flex;flex-wrap:wrap;gap:5px 12px;margin-top:10px;font-size:12px;color:var(--muted)}
.kv b{color:var(--fg);font-weight:500}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;border:1px solid}
.pill.good{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,transparent)}
.pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,transparent)}
.pill.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,transparent)}
.why{color:var(--muted);font-size:12px;margin:9px 0 0}
.imps{display:grid;gap:5px}.imp{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) 46px;gap:8px;align-items:center;font-size:11.5px}
.imp .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#cfd8e0}.imp .b{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden}.imp .b i{display:block;height:100%;border-radius:4px;box-shadow:0 0 8px currentColor}
.imp .v{font-family:var(--f-mono);font-size:11px;text-align:right}.imp .v em{font-style:normal;margin-left:3px;color:var(--muted)}
.lanes{display:grid;gap:5px}
.lane{display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:4px 10px;align-items:center;text-align:left;padding:7px 10px;width:100%}
.lane .sw{width:8px;height:28px;border-radius:2px;background:var(--cc);box-shadow:0 0 8px var(--cc);grid-row:span 2}
.lane .n{font-weight:600}.lane .v{font-family:var(--f-disp);font-size:18px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.lane .s{font-size:11px;color:var(--muted);grid-column:2/4;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lane[aria-pressed="true"]{background:color-mix(in srgb,var(--cc) 14%,var(--panel2));border-color:var(--cc);color:var(--fg)}
.log{font-family:var(--f-mono);font-size:11.5px;max-height:220px;overflow:auto;display:grid;gap:3px}
.log{overflow-x:hidden}.log div{display:grid;grid-template-columns:62px minmax(0,1fr);gap:8px;animation:lin .4s ease}
.log b{color:var(--dim);font-weight:400}.log .fc span{color:#cfe8ff}.log .warn span{color:var(--warn)}.log .op span{color:var(--muted)}
@keyframes lin{from{opacity:0;transform:translateX(8px)}}
.tl{grid-column:1;min-width:0}
.tl .head{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;margin-bottom:6px}
.tl .head h2{margin:0}.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.leg i{display:inline-block;width:12px;height:3px;vertical-align:middle;margin-right:5px;border-radius:2px}
#tlc{width:100%;height:220px;display:block}
.note{color:var(--dim);font-size:11.5px;margin:8px 0 0}
.crumb{display:flex;align-items:center;gap:4px;flex-wrap:wrap;pointer-events:auto;margin-bottom:4px}
.crumb button{background:rgba(10,15,21,.7);border-color:var(--line2);font-size:12px;padding:3px 9px}
.crumb button[aria-current="page"]{border-color:var(--cc,var(--amber));color:#fff;cursor:default}
.crumb i{color:var(--dim);font-style:normal}
.hudtl{pointer-events:none}.hudtl .crumb{pointer-events:auto}
.acts{position:absolute;right:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:60%}
.acts button{background:rgba(10,15,21,.86);font-size:12.5px;display:flex;align-items:center;gap:6px}
.acts button b{font-family:var(--f-mono);font-size:10.5px;color:var(--dim);font-weight:400;border:1px solid var(--line2);border-radius:3px;padding:0 4px}
.acts button.pri{border-color:var(--cc,var(--amber));color:#fff}
.guide{position:absolute;left:14px;bottom:66px;width:min(400px,calc(100% - 28px));background:rgba(5,9,13,.86);border:1px solid var(--line2);border-left:3px solid var(--cc,var(--amber));border-radius:6px;padding:10px 13px 11px;display:grid;gap:6px;transition:opacity .35s}
.guide .gk{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;color:var(--cc,var(--amber))}
.guide .gt{font-weight:700;font-size:14.5px}
.guide .gb{font-size:12px;color:#c9d4dc;display:grid;gap:3px}
.guide .gb .sy{display:inline-block;width:14px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:6px}
.guide .gh{font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:6px;display:flex;flex-wrap:wrap;gap:4px 12px}
.guide .gh span::before{content:"▶ ";color:var(--cc,var(--amber))}
.guide .gx{position:absolute;right:8px;top:7px;font-size:11px;padding:2px 8px;background:transparent}
.guide.mini .gb,.guide.mini .gh{display:none}.guide.mini{width:auto;max-width:min(430px,calc(100% - 28px));padding-right:96px}
.guide.hide{opacity:0;pointer-events:none}
.tip{position:absolute;pointer-events:none;z-index:4;background:rgba(5,9,13,.94);border:1px solid var(--cc,var(--amber));border-radius:6px;padding:7px 10px;font-size:12px;max-width:280px;transform:translate(14px,14px)}
.tip b{display:block;font-size:13px;margin-bottom:2px}.tip span{color:var(--muted)}.tip em{display:block;font-style:normal;color:var(--cc,var(--amber));margin-top:4px;font-weight:600}
.tcard{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;z-index:3;opacity:0}
.tcard .a{font-family:var(--f-mono);font-size:12px;letter-spacing:.3em;color:var(--cc,var(--amber))}
.tcard .b{font-family:var(--f-disp);font-size:54px;font-weight:700;line-height:1.05;color:#fff;text-shadow:0 0 30px color-mix(in srgb,var(--cc,#ffae42) 60%,transparent)}
.tcard .c{font-size:13px;color:#cfdbe4}
.tcard.go{animation:tc 1.6s ease forwards}
@keyframes tc{0%{opacity:0;transform:translate(-50%,-50%) scale(1.25);filter:blur(6px)}22%{opacity:1;transform:translate(-50%,-50%) scale(1);filter:blur(0)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(.92)}}
.iris{position:absolute;inset:0;pointer-events:none;z-index:2;--x:50%;--y:50%;--r:2000px;background:radial-gradient(circle at var(--x) var(--y),transparent var(--r),rgba(255,174,66,.95) calc(var(--r) + 1px),rgba(255,174,66,0) calc(var(--r) + 7px),#020407 calc(var(--r) + 8px))}
.stage.launching .hudtl,.stage.launching .acts,.stage.launching .guide,.stage.launching .hbar,.stage.launching .banner,.stage.launching .cine{opacity:0;transition:opacity .25s;pointer-events:none}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 35%,rgba(0,0,0,.85));opacity:0;transition:opacity .9s}
.vig.on{opacity:1}
.stage.hov canvas{cursor:pointer}
.lbl.big{font-family:var(--f-disp);font-size:15px;font-weight:600;padding:1px 6px;border-radius:3px;background:rgba(5,9,13,.7)}
.lbl.yt{color:#7d8b97;font-size:10.5px}
.lbl.zt{font-family:var(--f-body);font-size:12px;font-weight:600;padding:2px 8px;border:1px solid var(--c);border-radius:999px;background:rgba(5,9,13,.75)}
.lbl.dt{font-family:var(--f-mono);font-size:11px;line-height:1.35;padding:4px 7px;border-radius:4px;background:rgba(5,9,13,.86);border:1px solid var(--line2);color:#dfe7ee;text-align:center}
.lbl.dt b{font-family:var(--f-disp);font-size:18px;color:var(--c);display:block}
.lbl.dt.on{border-color:var(--c);box-shadow:0 0 14px color-mix(in srgb,var(--c) 40%,transparent)}
.lbl.dt.off{opacity:.45}
.lbl.dt .e{color:#ff8a8a}
@media (max-width:1100px){.wrap{grid-template-columns:minmax(0,1fr)}aside{grid-row:auto}}
@media (max-width:600px){.wrap{padding:10px 16px 24px}.stage{height:62vh}.hudtl .t{font-size:22px}.cine{display:none}.big{font-size:36px}.acts{max-width:100%;left:8px;right:8px;top:auto;bottom:62px;justify-content:center}.guide{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ===== 생키 전체 화면 (변수 가중치) ===== */
#skv{position:fixed;inset:0;z-index:80;display:grid;grid-template-rows:auto 1fr auto;gap:10px;padding:20px 26px 16px;background:radial-gradient(ellipse at 60% 40%,rgba(14,22,32,.97),rgba(3,6,9,.985));backdrop-filter:blur(6px);animation:skvIn .45s ease}
#skv[hidden]{display:none}
@keyframes skvIn{from{opacity:0;transform:scale(1.015)}to{opacity:1;transform:none}}
.skv-h{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap}
.skv-ttl .k{font-family:var(--f-mono);font-size:11px;letter-spacing:.24em;color:var(--amber)}
.skv-ttl .t{font-family:var(--f-body);font-weight:600;font-size:clamp(20px,2vw,28px);margin-top:6px;color:var(--fg)}
.skv-ttl .s{font-size:12.5px;color:var(--muted);margin-top:5px;max-width:760px;line-height:1.5}
.skv-c{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.skv-c .seg button[aria-pressed="true"]{background:color-mix(in srgb,var(--cc,var(--amber)) 22%,var(--panel2));color:var(--fg);box-shadow:inset 0 -2px 0 var(--cc,var(--amber))}
.skv-c>button{border:1px solid var(--line2);background:var(--panel2);color:var(--fg);border-radius:999px;padding:7px 14px;font-size:12.5px;cursor:pointer}
.skv-c>button b{font-family:var(--f-mono);font-size:10px;color:var(--dim);margin-left:6px}
.skv-c>button.pri{border-color:var(--cc,var(--amber));color:var(--cc,var(--amber))}
.skv-body{position:relative;min-height:0}#skvC{position:absolute;inset:0;width:100%;height:100%;display:block}
.skv-tip{position:absolute;z-index:2;pointer-events:none;background:rgba(5,9,13,.95);border:1px solid var(--line2);border-radius:6px;padding:9px 11px;display:grid;gap:3px;font-size:12px;color:var(--muted);max-width:280px}
.skv-tip b{font-size:13px}.skv-tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}.skv-tip em{font-style:normal;color:var(--amber);font-size:11px}
.skv-f{font-size:11.5px;color:var(--dim);line-height:1.5}

function fitT(g,t,w){if(g.measureText(t).width<=w)return t;let s=t;while(s.includes(' ')&&g.measureText(s+'…').width>w)s=s.slice(0,s.lastIndexOf(' '));

const SK4M=()=>SANKEY4['모드'][skvMode==='선종'?'최종':'후보']||{};
const skvShip=k=>SK4M()[SHIPS[k]];
const COLN=['① 데이터 원천','② processed CSV','③ 변수','④ 선종'];
/* 흐름(선종 × 변수) → 네 열의 노드와 이웃 열 사이 링크로 모은다. 전체 보기는 변수 상위 18개 + 나머지는 '기타'로 묶되 원천·CSV 경로는 그대로 */
function skvLayout(W,H){const M=SK4M(),ships=skvK!=null?[skvK]:SHIPS.map((_,k)=>k),top=34,bot=10,avail=H-top-bot;
  const flows=[];ships.forEach(k=>{const S=M[SHIPS[k]];if(!S)return;S['변수'].forEach(x=>flows.push({k,x,w:x.w/ships.length}));});
  const vt={};flows.forEach(f=>vt[f.x['변수']]=(vt[f.x['변수']]||0)+f.w);const NV=skvK!=null?15:18,keep=new Set(Object.entries(vt).sort((a,b)=>b[1]-a[1]).slice(0,NV).map(e=>e[0])),nRest=Object.keys(vt).length-keep.size;
  const C=[new Map(),new Map(),new Map(),new Map()],node=(c,id,o)=>{let n=C[c].get(id);if(!n){n={c,id,w:0,...o};C[c].set(id,n);}return n;};
  flows.forEach(f=>{const x=f.x,rest=!keep.has(x['변수']);f.n=[node(0,x['원천'],{label:x['원천'],sid:x['원천ID'],url:x.URL}),node(1,x.csv,{label:csvName(x.csv),path:x.csv}),
      rest?node(2,'__rest',{label:`기타 ${nRest}개 변수`,g:'기타',rest:true}):node(2,x['변수'],{label:vname(x['변수']),g:x['대분류'],lag:x['시차']}),node(3,'s'+f.k,{label:SHIPS[f.k],k:f.k})];
    f.n.forEach(n=>n.w+=f.w);});
  const cols=C.map(m=>[...m.values()]);cols[0].sort((a,b)=>b.w-a.w);cols[1].sort((a,b)=>b.w-a.w);cols[2].sort((a,b)=>(a.rest?1:0)-(b.rest?1:0)||b.w-a.w);cols[3].sort((a,b)=>a.k-b.k);
  const X=[Math.round(Math.max(250,W*.2)),Math.round(W*.43),Math.round(W*.64),Math.round(W-Math.max(210,W*.15))],nw=10;
  cols.forEach((col,c)=>{const tot=col.reduce((a,n)=>a+n.w,0),gap=Math.min(c===3?22:8,avail*.25/Math.max(1,col.length-1)),sc=(avail-gap*(col.length-1))/tot;let y=top;
    col.forEach(n=>{n.x=X[c];n.y=y;n.h=Math.max(2,n.w*sc);n.sc=sc;y+=n.h+gap;n.oo=0;n.oi=0;});});
  // 이웃 열 링크 (a→b) 합치기 · 각 흐름이 지나는 링크 기록
  const LK=new Map();flows.forEach(f=>{f.l=[];for(let c=0;c<3;c++){const a=f.n[c],b=f.n[c+1],id=a.c+'|'+a.id+'>'+b.id;let l=LK.get(id);if(!l){l={a,b,w:0,ks:new Map()};LK.set(id,l);}l.w+=f.w;l.ks.set(f.k,(l.ks.get(f.k)||0)+f.w);f.l.push(l);}});
  const links=[...LK.values()];
  cols.forEach(col=>col.forEach(n=>{links.filter(l=>l.a===n).sort((p,q)=>p.b.y-q.b.y).forEach(l=>{l.h0=l.w*n.sc;l.y0=n.y+n.oo;n.oo+=l.h0;});
    links.filter(l=>l.b===n).sort((p,q)=>p.a.y-q.a.y).forEach(l=>{l.h1=l.w*n.sc;l.y1=n.y+n.oi;n.oi+=l.h1;});}));
  return {cols,links,flows,X,nw,top};}
// 강조: 노드·링크를 지나는 흐름 전체(원천 → 선종 경로)를 밝힌다
function skvLit(Lo,hot){if(!hot)return null;const fs=Lo.flows.filter(f=>hot.t==='n'?f.n.some(n=>n.c===hot.n.c&&n.id===hot.n.id):f.l.some(l=>l.a.id===hot.l.a.id&&l.b.id===hot.l.b.id&&l.a.c===hot.l.a.c)),L=new Set(),N=new Set();fs.forEach(f=>{f.l.forEach(l=>L.add(l));f.n.forEach(n=>N.add(n));});return {L,N};}
function nodeCol(n){return n.c===3?CSSC[n.k]:n.c===2?gcss(n.g):n.c===1?'#8fa3b5':'#c9d3dc';}
function drawSKV(){if(skv.hidden)return;const cv=$('skvC'),dpr=Math.min(2,devicePixelRatio),W=cv.clientWidth,H=cv.clientHeight;if(!W||!H)return;
  if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);}
  const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);const Lo=skvL=skvLayout(W,H),{cols,links,X,nw}=Lo,lit=skvLit(Lo,skvPin||skvHot);
  const prog=RM?1:Math.min(1,(performance.now()-skvT0)/1100),ep=1-Math.pow(1-prog,3);
  // 열 제목
  g.font='600 11px "JetBrains Mono",monospace';g.textBaseline='alphabetic';COLN.forEach((t,c)=>{g.fillStyle='#7d8b98';g.textAlign=c===0?'right':'left';g.fillText(t,c===0?X[0]+nw:X[c],14);});
  // 링크 — 원천에서 선종 쪽으로 펼쳐진다
  g.save();g.beginPath();g.rect(0,0,X[0]+nw+(W-X[0])*ep,H);g.clip();
  links.forEach(l=>{const on=!lit||lit.L.has(l),x0=l.a.x+nw,x1=l.b.x,xm=(x0+x1)/2;g.beginPath();g.moveTo(x0,l.y0);g.bezierCurveTo(xm,l.y0,xm,l.y1,x1,l.y1);g.lineTo(x1,l.y1+l.h1);g.bezierCurveTo(xm,l.y1+l.h1,xm,l.y0+l.h0,x0,l.y0+l.h0);g.closePath();
    const gr=g.createLinearGradient(x0,0,x1,0),al=on?(lit?'c0':'60'):'12';gr.addColorStop(0,nodeCol(l.a)+al);gr.addColorStop(1,nodeCol(l.b)+al);g.fillStyle=gr;g.fill();});
  g.restore();
  // 노드와 이름
  const pc=w=>{const p=w*100;return (p>=10?p.toFixed(0):p.toFixed(1))+'%';};
  cols.forEach((col,c)=>{let last=-99;col.forEach(n=>{const on=!lit||lit.N.has(n);g.globalAlpha=on?1:.25;g.fillStyle=nodeCol(n);g.fillRect(n.x,n.y,c===3?12:nw,n.h);
    const cy=n.y+n.h/2,big=n.h>=16;g.textBaseline='middle';if(cy-last<13&&!(lit&&lit.N.has(n)))return;last=cy;   // 작은 노드 이름이 겹치면 생략 — 올리면 보임
    if(c===0){g.textAlign='right';g.font=`300 ${big?20:14}px "Saira Condensed","Inter",sans-serif`;g.fillStyle='#c9d3dc';const ps=pc(n.w);g.fillText(ps,n.x-8,cy);const pw=g.measureText(ps).width+16;
      g.font=`${big?600:500} ${big?13.5:12}px "IBM Plex Sans KR",sans-serif`;g.fillStyle='#e8eef4';g.fillText(fitT(g,n.label,n.x-pw-14),n.x-pw,cy);}
    else if(c<3){const tx=n.x+nw+6,mw=X[c+1]-tx-58;g.textAlign='left';g.font=`${big?600:500} ${big?12.5:11}px "IBM Plex Sans KR",sans-serif`;const t=fitT(g,n.label,mw),tw=g.measureText(t).width;
      g.fillStyle='rgba(5,9,13,.72)';g.fillRect(tx-3,cy-8,tw+(c===2?46:6),16);g.fillStyle=c===2?(n.rest?'#93a1ad':'#e8eef4'):'#cfd8e0';g.fillText(t,tx,cy);
      if(c===2){g.font='300 13px "Saira Condensed","Inter",sans-serif';g.fillStyle=gcss(n.g);g.fillText(pc(n.w),tx+tw+6,cy);}}
    else{const S=skvShip(n.k),tx=n.x+22;g.textAlign='left';g.font=`600 ${skvK!=null?22:16}px "IBM Plex Sans KR",sans-serif`;g.fillStyle=CSSC[n.k];g.fillText(n.label,tx,cy-(skvK!=null?14:8));
      g.font='11.5px "IBM Plex Sans KR",sans-serif';g.fillStyle='#93a1ad';if(S)g.fillText(fitT(g,S['모형'],W-tx-12),tx,cy+(skvK!=null?8:9));}});});
  g.globalAlpha=1;if(prog<1)requestAnimationFrame(drawSKV);}
function skvHead(){const s=skvK!=null?SHIPS[skvK]:null,S=s?skvShip(skvK):null;
  $('skvT').textContent=s?`${s} — 어느 원천·CSV의 어떤 변수에 기댔나`:'다섯 선종 — 데이터 원천에서 변수 가중치까지';
  $('skvS').textContent=(skvMode==='후보'?'후보 변수 전체로 학습한 랜덤 포레스트의 TreeSHAP 비중 (진단용)':'실제로 선택된 최종 모형의 변수 영향도')+(S?' · '+S['방법']:'')+` · 원천 · CSV 근거: 변수 사전(${SANKEY4['사전수정']} 수정본)`;
  const seg=(id,items,cur,fn)=>{const el=$(id);el.innerHTML='';items.forEach(([v,t,c])=>{const b=document.createElement('button');b.textContent=t;if(c)b.style.setProperty('--cc',c);b.setAttribute('aria-pressed',String(v===cur));b.onclick=()=>fn(v);el.appendChild(b);});};
  seg('skvM',[['후보','후보 진단'],['선종','최종 모형']],skvMode,v=>{skvMode=v;skvPin=null;skvT0=performance.now();skvHead();drawSKV();});
  seg('skvF',[[null,'전체'],...SHIPS.map((x,k)=>[k,x,CSSC[k]])],skvK,v=>openSKV(v));
  const lb=$('skvLane');lb.hidden=skvK==null;if(skvK!=null){lb.textContent=`${SHIPS[skvK]} 레인으로 →`;lb.style.setProperty('--cc',CSSC[skvK]);}
  $('skvFoot').textContent=`${skvK!=null?'퍼센트 = 이 선종 모형 안에서의 비중(합 100%)':'퍼센트 = 다섯 선종 평균 비중 · 선종을 누르면 그 선종만 펼침'} · 같은 굵기가 변수 → CSV → 원천으로 거슬러 흐름 · 노드·띠에 올리면 그 경로만 밝힘(클릭 고정) · 추세를 뺀 상관은 유의 0개라 인과가 아니라 '모형이 기댄 정도'로 읽습니다`;}
function openSKV(k=null){skvK=k;skvPin=null;skvHot=null;skv.hidden=false;document.body.classList.add('skv-open');skvT0=performance.now();skvHead();requestAnimationFrame(drawSKV);
  if(typeof log==='function')log(`SANKEY ${k!=null?SHIPS[k]:'전체'} · ${skvMode==='후보'?'후보 진단':'최종 모형'}`);}
function closeSKV(){skv.hidden=true;document.body.classList.remove('skv-open');$('skvTip').hidden=true;}
$('skvX').onclick=closeSKV;$('skvLane').onclick=()=>{const k=skvK;closeSKV();if(k!=null){stopTour();go('lane',k);}};
addEventListener('resize',drawSKV);
// 마우스: 노드·띠에 올리면 그 경로 강조 + 설명, 클릭: 선종 펼치기 / 경로 고정
function skvHit(x,y){const Lo=skvL;if(!Lo)return null;const {cols,links,X,nw}=Lo;
  for(const col of cols)for(const n of col){const x0=n.c===0?Math.max(0,n.x-240):n.x,x1=n.c===3?n.x+220:n.c===0?n.x+nw:n.x+nw+Math.min(200,X[n.c+1]-n.x-40);if(x>=x0&&x<=x1&&y>=n.y-2&&y<=n.y+n.h+2)return {t:'n',n};}
  for(let i=links.length-1;i>=0;i--){const l=links[i],x0=l.a.x+nw,x1=l.b.x;if(x<x0||x>x1)continue;const u=(x-x0)/(x1-x0),e=u*u*(3-2*u),yt=l.y0+(l.y1-l.y0)*e,hb=l.h0+(l.h1-l.h0)*u;if(y>=yt-1&&y<=yt+Math.max(3,hb)+1)return {t:'l',l};}
  return null;}
function skvTipHtml(h){if(!h)return '';const pc=w=>(w*100).toFixed(w>=.1?0:1)+'%',Lo=skvL,uniq=a=>[...new Set(a)];
  const byShip=fs=>{const m=new Map();fs.forEach(f=>m.set(f.k,(m.get(f.k)||0)+f.w));return [...m].sort((a,b)=>b[1]-a[1]).map(([k,w])=>`<span><i style="background:${CSSC[k]}"></i>${SHIPS[k]} ${pc(w)}</span>`).join('');};
  if(h.t==='n'){const n=h.n,fs=Lo.flows.filter(f=>f.n.includes(n));
    if(n.c===0)return `<b>${n.label}</b><span>원천 ID ${n.sid} · 비중 ${pc(n.w)}</span>${n.url?`<span style="color:#7d8b98">${n.url.slice(0,70)}</span>`:''}<span>→ CSV ${uniq(fs.map(f=>f.n[1].label)).length}개 · 변수 ${uniq(fs.map(f=>f.x['변수'])).length}개</span>`+byShip(fs);
    if(n.c===1)return `<b>${n.label}</b><span>${n.path}</span><span>원천: ${uniq(fs.map(f=>f.n[0].label)).join(' · ')}</span><span>변수 ${uniq(fs.map(f=>f.x['변수'])).length}개 · 비중 ${pc(n.w)}</span>`+byShip(fs);
    if(n.c===2)return `<b style="color:${gcss(n.g)}">${n.label}</b><span>${n.rest?'상위 밖 변수 묶음':n.g+(n.lag!=null?` · 공표 시차 ${n.lag}개월`:'')}</span><span>${uniq(fs.map(f=>f.n[0].label+' → '+f.n[1].label)).slice(0,3).join('<br>')}</span>`+byShip(fs);
    const S=skvShip(n.k);return `<b style="color:${CSSC[n.k]}">${n.label}</b><span>${S?S['모형']:''}</span><span>${S?S['방법']:''}</span><em>${skvK==null?'클릭 → 이 선종만 펼치기':'레인 버튼으로 막대 차트 보기'}</em>`;}
  const l=h.l;return `<b>${l.a.label} → ${l.b.label}</b><span>비중 ${pc(l.w)}</span>`+[...l.ks].sort((a,b)=>b[1]-a[1]).map(([k,w])=>`<span><i style="background:${CSSC[k]}"></i>${SHIPS[k]} ${pc(w)}</span>`).join('');}
{const cv=$('skvC'),tipE=$('skvTip'),keyOf=h=>h?(h.t==='n'?'n'+h.n.c+h.n.id:'l'+h.l.a.c+h.l.a.id+'>'+h.l.b.id):null;
  cv.addEventListener('pointermove',e=>{const b=cv.getBoundingClientRect(),h=skvHit(e.clientX-b.left,e.clientY-b.top);
    if(keyOf(h)!==keyOf(skvHot)){skvHot=h;drawSKV();}cv.style.cursor=h&&h.t==='n'?'pointer':'default';
    if(h){tipE.innerHTML=skvTipHtml(h);tipE.hidden=false;const tx=Math.min(e.clientX-b.left+16,b.width-300);tipE.style.left=tx+'px';tipE.style.top=Math.min(e.clientY-b.top+14,b.height-160)+'px';}else tipE.hidden=true;});
  cv.addEventListener('pointerleave',()=>{skvHot=null;tipE.hidden=true;drawSKV();});
  cv.addEventListener('click',e=>{const b=cv.getBoundingClientRect(),h=skvHit(e.clientX-b.left,e.clientY-b.top);
    if(h&&h.t==='n'&&h.n.c===3&&skvK==null){openSKV(h.n.k);return;}skvPin=h&&keyOf(skvPin)!==keyOf(h)?h:null;drawSKV();});}
// 키: S 열기/닫기 · Esc 닫기 · ←→ 선종 이동 (열려 있을 때 관제 단축키보다 먼저)
addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input,textarea'))return;const k=e.key;
  if(!skv.hidden){if(k==='Escape'||k==='s'||k==='S'){closeSKV();}else if(k==='ArrowRight'||k==='ArrowLeft'){const seq=[null,0,1,2,3,4],i=skvK==null?0:skvK+1;openSKV(seq[(i+(k==='ArrowRight'?1:5))%6]);}
    else return;e.preventDefault();e.stopImmediatePropagation();return;}
  if((k==='s'||k==='S')&&typeof launch!=='undefined'&&!launch){openSKV(level==='hub'?null:sel);e.preventDefault();e.stopImmediatePropagation();}},true);
// 주소로 바로 열기: ?skv=all · ?skv=0~4(선종) · &skvm=final(최종 모형)
{const q=new URLSearchParams(location.search),v=q.get('skv');if(v!=null){if(q.get('skvm')==='final')skvMode='선종';setTimeout(()=>openSKV(v==='all'?null:Math.max(0,Math.min(4,+v||0))),1500);}}
</script>
