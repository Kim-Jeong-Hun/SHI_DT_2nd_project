[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ship-orders-forecasting"
version = "0.1.0"
description = "Monthly ship-order forecasting pipelines for five vessel types"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "openpyxl>=3.1",
    "xlrd>=2.0,<3.0",
    "pypdf>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

